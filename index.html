<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Engine-Free 3D Game Framework</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: 'Segoe UI', Arial, sans-serif;
  touch-action: none;
}
#rotate-overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh;
  background: #0a0a0a;
  color: #fff;
  z-index: 9999;
  display: none;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  text-align: center;
  font-size: 16px;
  padding: 20px;
}
#rotate-overlay .icon { font-size: 48px; margin-bottom: 14px; animation: rotate-hint 1.6s ease-in-out infinite; }
@keyframes rotate-hint { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(90deg); } }
@media (orientation: portrait) {
  #rotate-overlay { display: flex; }
  #app { display: none; }
}
#app {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
}
#game-canvas {
  display: block;
  width: 100%;
  height: 100%;
  outline: none;
}
#hud {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 30;
}
#crosshair {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 26px;
  height: 26px;
  margin: -13px 0 0 -13px;
  pointer-events: none;
  z-index: 31;
}
#crosshair .ch-ring {
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  border: 2px solid rgba(255,255,255,0.8);
  border-radius: 50%;
  box-sizing: border-box;
  transition: transform 0.1s ease-out, border-color 0.12s ease;
}
#crosshair .ch-dot {
  position: absolute;
  top: 50%; left: 50%;
  width: 3px; height: 3px;
  margin: -1.5px 0 0 -1.5px;
  border-radius: 50%;
  background: rgba(255,255,255,0.9);
}
#crosshair.target-lock .ch-ring { border-color: #ff3b3b; }
#crosshair.expanded .ch-ring { transform: scale(1.35); }
#crosshair.swing .ch-ring { transform: scale(1.6); border-color: #ffcc33; }

#fps-counter {
  position: absolute;
  top: 12px;
  left: 12px;
  color: #0f0;
  font-size: 12px;
  font-family: monospace;
  background: rgba(0, 0, 0, 0.4);
  padding: 4px 8px;
  border-radius: 4px;
}
.ui-btn {
  pointer-events: auto;
  border: 2px solid rgba(255, 255, 255, 0.5);
  background: rgba(20, 20, 20, 0.55);
  color: #fff;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  backdrop-filter: blur(2px);
}
#cam-switch-btn {
  position: absolute;
  top: 12px;
  right: 12px;
  width: 40px;
  height: 40px;
  font-size: 16px;
}
#inventory-btn {
  position: absolute;
  top: 12px;
  right: 58px;
  width: 40px;
  height: 40px;
  font-size: 16px;
}
#mobile-controls {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 20;
  display: none;
}
#mobile-controls.active { display: block; }
.control-zone {
  position: absolute;
  bottom: 0;
  height: 55%;
  pointer-events: auto;
  touch-action: none;
}
#joystick-zone { position: absolute; left: 0; right: auto; width: 50%; z-index: 22; pointer-events: auto; bottom: 0; top: auto; height: 55%; }
#look-zone { position: absolute; right: 0; left: auto; width: 50%; z-index: 21; pointer-events: auto; top: 0; height: 100%; touch-action: none; }
#joystick-base {
  position: absolute;
  width: 110px;
  height: 110px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.12);
  border: 2px solid rgba(255, 255, 255, 0.35);
  left: 40px;
  bottom: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}
#joystick-knob {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.55);
  border: 2px solid rgba(255, 255, 255, 0.8);
  position: relative;
  pointer-events: none;
}
.small-btn {
  position: absolute;
  border-radius: 50%;
  font-size: 10px;
  font-weight: bold;
  z-index: 26;
}
.small-btn:active, .ui-btn:active { transform: scale(0.9); background: rgba(60,60,60,0.75); }
.small-btn.disabled { opacity: 0.35; pointer-events: none; }

#jump-btn { right: 14px; bottom: 56px; width: 60px; height: 60px; font-size: 12px; }
#dash-btn {
  right: 90px; bottom: 56px; width: 54px; height: 54px; font-size: 11px;
  background: rgba(60,110,220,0.5); backdrop-filter: blur(6px);
  overflow: hidden;
}
#dash-btn .cooldown-fill {
  position: absolute;
  left: 0; bottom: 0; width: 100%; height: 0%;
  background: rgba(0,0,0,0.55);
  pointer-events: none;
  transition: height 0.05s linear;
}
#dash-btn.on-cooldown { opacity: 0.7; }
#crouch-btn {
  position: absolute; top: 12px; right: 104px; width: 40px; height: 40px; font-size: 15px;
  background: rgba(120,120,120,0.5); backdrop-filter: blur(6px);
}
#crouch-btn.active { background: rgba(255,204,51,0.55); border-color: #ffcc33; }

#interact-prompt {
  position: absolute;
  top: 58%;
  left: 50%;
  transform: translateX(-50%);
  color: #fff;
  background: rgba(0,0,0,0.55);
  padding: 6px 14px;
  border-radius: 6px;
  font-size: 13px;
  display: none;
  z-index: 31;
  white-space: nowrap;
}
#interact-prompt.visible { display: block; }

#hit-marker {
  position: absolute;
  top: 50%; left: 50%;
  width: 26px; height: 26px;
  margin: -13px 0 0 -13px;
  pointer-events: none;
  opacity: 0;
  z-index: 32;
}
#hit-marker.show { animation: hitmarker-pop 0.25s ease-out; }
#hit-marker.combo::before, #hit-marker.combo::after { background: #ffcc33; }
#hit-marker.combo { width: 34px; height: 34px; margin: -17px 0 0 -17px; }

.damage-popup {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  color: #fff;
  font-family: 'Courier New', monospace;
  font-weight: bold;
  font-size: 20px;
  text-shadow: 0 2px 4px rgba(0,0,0,0.8), 0 0 8px rgba(0,0,0,0.5);
  pointer-events: none;
  z-index: 33;
  opacity: 0;
  animation: damage-popup-float 0.9s ease-out forwards;
}
.damage-popup.headshot { color: #ff5c3c; font-size: 26px; }
.damage-popup.combo { color: #ffcc33; font-size: 26px; }
@keyframes damage-popup-float {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(0.7); }
  15% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
  30% { transform: translate(-50%, -50%) scale(1); }
  100% { opacity: 0; transform: translate(calc(-50% + var(--drift-x, 0px)), calc(-50% - 46px)) scale(1); }
}
@keyframes hitmarker-pop {
  0% { opacity: 1; transform: scale(0.6); }
  60% { opacity: 1; transform: scale(1.1); }
  100% { opacity: 0; transform: scale(1.3); }
}
#hit-marker::before, #hit-marker::after {
  content: '';
  position: absolute;
  background: #fff;
  width: 3px; height: 10px;
}
#hit-marker::before { top: 0; left: 0; transform: rotate(45deg); transform-origin: bottom; }
#hit-marker::after { top: 0; right: 0; transform: rotate(-45deg); transform-origin: bottom; }

#damage-flash {
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  background: radial-gradient(circle, transparent 40%, rgba(255,0,0,0.35) 100%);
  opacity: 0;
  pointer-events: none;
  z-index: 29;
  transition: opacity 0.3s ease;
}
#damage-flash.show { opacity: 1; transition: opacity 0.05s ease; }

#pickup-toast {
  position: absolute;
  top: 20%;
  left: 50%;
  transform: translateX(-50%);
  color: #fff;
  background: rgba(0,0,0,0.6);
  padding: 8px 16px;
  border-radius: 6px;
  font-size: 14px;
  opacity: 0;
  z-index: 31;
  transition: opacity 0.3s ease, transform 0.3s ease;
}
#pickup-toast.show { opacity: 1; transform: translateX(-50%) translateY(10px); }

#weapon-hud {
  position: absolute;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%);
  color: #fff;
  font-family: monospace;
  font-size: 13px;
  font-weight: bold;
  letter-spacing: 1px;
  text-shadow: 0 1px 3px rgba(0,0,0,0.8);
  z-index: 31;
  text-align: center;
  background: rgba(0,0,0,0.35);
  padding: 4px 12px;
  border-radius: 6px;
}

#inventory-panel {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(10,10,14,0.55);
  backdrop-filter: blur(4px);
  z-index: 40;
  display: none;
  align-items: center;
  justify-content: center;
  pointer-events: auto;
}
#inventory-panel.visible { display: flex; }
#inventory-panel .panel-box {
  background: rgba(40,42,54,0.55);
  backdrop-filter: blur(14px) saturate(140%);
  border: 2px solid rgba(255,255,255,0.25);
  border-radius: 12px;
  padding: 16px;
  min-width: 300px;
  max-width: 88vw;
  color: #fff;
  font-family: 'Courier New', monospace;
  box-shadow: 0 8px 30px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.15);
}
#inventory-panel h3 {
  margin-bottom: 12px; font-size: 13px; letter-spacing: 2px; opacity: 0.85;
  text-align: center; text-shadow: 0 1px 2px rgba(0,0,0,0.6);
}
#inventory-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  max-height: 56vh;
  overflow-y: auto;
  padding: 6px;
}
.inv-slot {
  aspect-ratio: 1;
  min-width: 56px;
  background: rgba(20,20,28,0.55);
  border: 2px solid rgba(255,255,255,0.18);
  border-radius: 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: grab;
  position: relative;
  backdrop-filter: blur(6px);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), inset 0 -2px 4px rgba(0,0,0,0.3);
  transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease;
}
.inv-slot:active { cursor: grabbing; transform: scale(0.94); }
.inv-slot.equipped { border-color: #ffcc33; background: rgba(255,204,51,0.16); box-shadow: 0 0 10px rgba(255,204,51,0.4), inset 0 1px 0 rgba(255,255,255,0.2); }
.inv-slot.drag-over { border-color: #6fdcff; background: rgba(111,220,255,0.16); }
.inv-slot.empty { cursor: default; opacity: 0.5; }
.inv-slot .slot-icon { font-size: 22px; line-height: 1; margin-bottom: 2px; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.6)); }
.inv-slot .slot-label { font-size: 8px; letter-spacing: 0.5px; opacity: 0.9; text-align: center; padding: 0 2px; }
.inv-slot .slot-stat { position: absolute; bottom: 2px; right: 4px; font-size: 8px; color: #ffcc33; }
#inventory-drop-zone {
  margin-top: 12px;
  padding: 10px;
  border: 2px dashed rgba(255,90,90,0.5);
  border-radius: 8px;
  text-align: center;
  font-size: 10px;
  letter-spacing: 1px;
  color: rgba(255,150,150,0.85);
  background: rgba(180,30,30,0.08);
  backdrop-filter: blur(6px);
  transition: background 0.15s ease, border-color 0.15s ease;
}
#inventory-drop-zone.drag-over { background: rgba(180,30,30,0.25); border-color: #ff5a5a; color: #fff; }
#inventory-empty-msg { opacity: 0.55; font-size: 11px; text-align: center; padding: 16px 8px; grid-column: 1 / -1; }
#inventory-close {
  margin-top: 14px;
  width: 100%;
  padding: 9px;
  background: rgba(255,255,255,0.12);
  border: 2px solid rgba(255,255,255,0.3);
  color: #fff;
  border-radius: 8px;
  font-family: 'Courier New', monospace;
  letter-spacing: 1px;
  cursor: pointer;
  backdrop-filter: blur(6px);
}
#inventory-close:active { background: rgba(255,255,255,0.22); }
#loading-screen {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: #0a0a0a;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  z-index: 100;
  transition: opacity 0.5s ease;
}
#loading-screen.hidden { opacity: 0; pointer-events: none; }

/* ===================== MULTIPLAYER UI ===================== */
#mp-lobby {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(8,9,12,0.94);
  z-index: 90;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: auto;
  color: #fff;
  font-family: 'Segoe UI', Arial, sans-serif;
}
/* display:none (not just opacity) — a full-screen backdrop-filter left
   merely at opacity:0 still gets composited every frame on most mobile
   GPUs, which is what was tanking FPS to ~1 once the lobby was dismissed.
   No blur, and fully removed from the render tree once hidden. */
#mp-lobby.hidden { display: none; }
#mp-lobby .mp-box {
  background: rgba(30,32,42,0.85);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 12px;
  padding: 22px 26px;
  width: min(340px, 88vw);
  max-height: 82vh;
  overflow-y: auto;
}
#mp-lobby h2 { font-size: 16px; letter-spacing: 1px; margin-bottom: 14px; text-align: center; }
#mp-lobby label { display: block; font-size: 11px; opacity: 0.7; margin: 10px 0 4px; }
#mp-lobby input {
  width: 100%; box-sizing: border-box; padding: 9px 10px;
  border-radius: 6px; border: 1px solid rgba(255,255,255,0.2);
  background: rgba(0,0,0,0.35); color: #fff; font-size: 14px;
  text-transform: uppercase;
}
#mp-lobby input#mp-name-input { text-transform: none; }
#mp-lobby .mp-row { display: flex; gap: 8px; margin-top: 14px; }
#mp-lobby button {
  flex: 1; pointer-events: auto; cursor: pointer;
  padding: 10px 8px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.25);
  background: rgba(47,111,237,0.55); color: #fff; font-size: 12px; font-weight: bold;
  letter-spacing: 0.5px;
}
#mp-lobby button.secondary { background: rgba(255,255,255,0.08); }
#mp-lobby button:disabled { opacity: 0.5; cursor: default; }
#mp-lobby #mp-error { color: #ff6b6b; font-size: 12px; margin-top: 10px; min-height: 14px; }
#mp-lobby #mp-room-info { font-size: 12px; opacity: 0.85; margin-top: 12px; line-height: 1.5; }
#mp-lobby #mp-room-code-display { font-size: 22px; font-weight: bold; letter-spacing: 3px; color: #ffcc33; text-align: center; margin: 6px 0; }
#mp-lobby #mp-player-list { list-style: none; margin-top: 8px; font-size: 12px; max-height: 140px; overflow-y: auto; }
#mp-lobby #mp-player-list li { padding: 3px 0; opacity: 0.85; border-bottom: 1px solid rgba(255,255,255,0.06); }
#mp-lobby #mp-server-row { margin-top: 10px; }
#mp-profile-summary { font-size: 12px; text-align: center; margin-bottom: 10px; color: #9dffb0; }
#mp-friends-list li { padding: 2px 0; opacity: 0.85; }
#mp-google-btn { background: rgba(255,255,255,0.12) !important; }

#mp-status {
  position: absolute;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 32;
  font-family: monospace;
  font-size: 11px;
  color: #fff;
  background: rgba(0,0,0,0.4);
  padding: 4px 10px;
  border-radius: 4px;
  pointer-events: none;
  white-space: nowrap;
}
#mp-status .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; background: #ffcc33; }
#mp-status.connected .dot { background: #33ff77; }
#mp-status.disconnected .dot { background: #ff3b3b; }

#local-health-wrap {
  position: absolute;
  bottom: 40px;
  left: 14px;
  z-index: 31;
  width: 130px;
  display: none;
}
#local-health-wrap.active { display: block; }
#local-health-wrap .hb-track {
  width: 100%; height: 10px; border-radius: 5px;
  background: rgba(0,0,0,0.45); border: 1px solid rgba(255,255,255,0.25);
  overflow: hidden;
}
#local-health-fill {
  height: 100%; width: 100%;
  background: linear-gradient(90deg, #33ff77, #9dff66);
  transition: width 0.15s ease, background 0.2s ease;
}
#local-health-wrap.low #local-health-fill { background: linear-gradient(90deg, #ff3b3b, #ff8a3b); }
#local-health-label { font-size: 10px; color: #fff; text-align: center; margin-top: 2px; font-family: monospace; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }

#remote-labels { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 29; overflow: hidden; }
.remote-label {
  position: absolute;
  transform: translate(-50%, -100%);
  text-align: center;
  font-family: monospace;
  font-size: 10px;
  color: #fff;
  text-shadow: 0 1px 2px rgba(0,0,0,0.9);
  white-space: nowrap;
}
.remote-label .rl-name { margin-bottom: 2px; }
.remote-label .rl-hb-track { width: 46px; height: 5px; border-radius: 3px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.35); overflow: hidden; margin: 0 auto; }
.remote-label .rl-hb-fill { height: 100%; background: #ff5a5a; transition: width 0.15s ease; }

#death-overlay {
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(80,0,0,0.35);
  z-index: 50;
  display: none;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  color: #fff;
  pointer-events: auto;
  font-family: monospace;
}
#death-overlay.show { display: flex; }
#death-overlay .death-title { font-size: 28px; letter-spacing: 3px; color: #ff5a5a; margin-bottom: 10px; }
#death-overlay .death-sub { font-size: 14px; opacity: 0.85; }

#mp-player-count {
  position: absolute;
  top: 12px;
  right: 106px;
  z-index: 31;
  font-family: monospace;
  font-size: 11px;
  color: #fff;
  background: rgba(0,0,0,0.4);
  padding: 4px 8px;
  border-radius: 4px;
  pointer-events: none;
}
</style>
</head>
<body>
  <div id="rotate-overlay">
    <div class="icon">📱</div>
    <div>Please rotate your device to landscape<br/>for the best experience</div>
  </div>

  <div id="app">
    <canvas id="game-canvas"></canvas>

    <div id="hud">
      <div id="crosshair">
        <div class="ch-ring"></div>
        <div class="ch-dot"></div>
      </div>
      <button id="cam-switch-btn" class="ui-btn">🎥</button>
      <button id="inventory-btn" class="ui-btn">🎒</button>
      <button id="crouch-btn" class="ui-btn">⬇️</button>
      <div id="fps-counter">FPS: 0</div>
      <div id="weapon-hud">UNARMED</div>
      <div id="interact-prompt"></div>
      <div id="hit-marker"></div>
      <div id="damage-popup-layer"></div>
      <div id="damage-flash"></div>
      <div id="pickup-toast"></div>

      <div id="mp-status"><span class="dot"></span><span id="mp-status-text">Offline</span></div>
      <div id="mp-player-count"></div>
      <div id="local-health-wrap">
        <div class="hb-track"><div id="local-health-fill"></div></div>
        <div id="local-health-label">100 / 100</div>
      </div>
      <div id="remote-labels"></div>
      <div id="death-overlay">
        <div class="death-title">YOU DIED</div>
        <div class="death-sub" id="death-sub-text">Respawning in 3...</div>
      </div>
    </div>

    <div id="mobile-controls">
      <div id="joystick-zone" class="control-zone">
        <div id="joystick-base">
          <div id="joystick-knob"></div>
        </div>
      </div>
      <div id="look-zone"></div>
      <button id="jump-btn" class="ui-btn small-btn">JUMP</button>
      <button id="dash-btn" class="ui-btn small-btn">DASH<div class="cooldown-fill" id="dash-cooldown-fill"></div></button>
    </div>

    <div id="inventory-panel">
      <div class="panel-box">
        <h3>INVENTORY</h3>
        <div id="inventory-grid"></div>
        <div id="inventory-drop-zone">DRAG HERE TO DROP</div>
        <button id="inventory-close">CLOSE</button>
      </div>
    </div>

    <div id="loading-screen">
      <div id="loading-text">Loading World...</div>
    </div>

    <div id="mp-lobby">
      <div class="mp-box">
        <h2>MULTIPLAYER</h2>

        <div id="mp-login-view">
          <div id="mp-profile-summary" style="display:none;"></div>
          <div class="mp-row">
            <button id="mp-google-btn">SIGN IN WITH GOOGLE</button>
          </div>
          <label for="mp-guest-name-input">Or play as a guest</label>
          <input id="mp-guest-name-input" type="text" placeholder="Your name" maxlength="16" style="text-transform:none;" />

class FirebaseManager {
  constructor() {
    this.user = null;
    this.profile = null; // { displayName, gameId, stats:{kills,deaths,xp}, inventory:[...], friends:[...] }
    this._listeners = new Map();
    this._saveTimer = null;
    if (fbReady) {
      onAuthStateChanged(fbAuth, (user) => this._onAuthChanged(user));
    }
  }

  on(event, fn) {
    if (!this._listeners.has(event)) this._listeners.set(event, []);
    this._listeners.get(event).push(fn);
  }
  _emit(event, payload) { for (const fn of this._listeners.get(event) || []) fn(payload); }

  async _onAuthChanged(user) {
    if (!user) { this.user = null; this.profile = null; this._emit('signedOut'); return; }
    this.user = user;
    try {
      await this._loadOrCreateProfile();
      this._emit('signedIn', this.profile);
    } catch (err) {
      this._emit('error', { message: 'Could not load your profile: ' + err.message });
    }
  }

  async signInGoogle() {
    if (!fbReady) throw new Error('Firebase is not configured yet — add your project keys, or continue as a guest.');
    await signInWithPopup(fbAuth, new GoogleAuthProvider());
  }

  // Guests never touch Firebase at all — no anonymous-auth dependency, no
  // network round trip, no way for a misconfigured/unconfigured project to
  // block play. This always succeeds synchronously.
  async signInGuest(name) {
    const displayName = (name || 'Guest').slice(0, 16);
    this.user = { uid: 'guest_' + Math.random().toString(36).slice(2, 10), displayName, isGuest: true };
    this.profile = { displayName, gameId: null, stats: { kills: 0, deaths: 0, xp: 0 }, inventory: [], friends: [] };
    this._emit('signedIn', this.profile);
  }

  async _loadOrCreateProfile() {
    if (!fbDb || !this.user) return;
    const ref = doc(fbDb, 'players', this.user.uid);
    const snap = await getDoc(ref);
    if (snap.exists()) {
      this.profile = snap.data();
      if (!this.profile.gameId) {
        // Upgrade an older profile created before short game IDs existed.
        try {
          this.profile.gameId = await allocateGameId(this.user.email, this.user.displayName, this.user.uid);
          await updateDoc(ref, { gameId: this.profile.gameId });
        } catch (err) { console.warn('Could not allocate a game ID', err); }
      }
    } else {
      let gameId = null;
      try { gameId = await allocateGameId(this.user.email, this.user.displayName, this.user.uid); }
      catch (err) { console.warn('Could not allocate a game ID', err); }
      this.profile = {
        displayName: this.user.displayName || 'Player', createdAt: Date.now(), gameId,
        stats: { kills: 0, deaths: 0, xp: 0 }, inventory: [], friends: [],
      };
      await setDoc(ref, this.profile);
    }
  }

  _canPersist() { return fbDb && this.user && !this.user.isGuest; }

  // Event-driven, occasional writes only — never per-frame or per-tick.
  async recordKill() {
    if (!this.profile) return;
    this.profile.stats.kills++;
    this.profile.stats.xp = (this.profile.stats.xp || 0) + 10;
    if (!this._canPersist()) return;
    try {
      await updateDoc(doc(fbDb, 'players', this.user.uid), {
        'stats.kills': this.profile.stats.kills, 'stats.xp': this.profile.stats.xp,
      });
    } catch (err) { console.warn(err); }
  }
  async recordDeath() {
    if (!this.profile) return;
    this.profile.stats.deaths++;
    if (!this._canPersist()) return;
    try { await updateDoc(doc(fbDb, 'players', this.user.uid), { 'stats.deaths': this.profile.stats.deaths }); } catch (err) { console.warn(err); }
  }

  // Debounced a few seconds — occasional account sync, not gameplay traffic.
  saveInventory(weaponIds) {
    if (!this.profile) return;
    this.profile.inventory = weaponIds;
    if (!this._canPersist()) return;
    clearTimeout(this._saveTimer);
    this._saveTimer = setTimeout(async () => {
      try { await updateDoc(doc(fbDb, 'players', this.user.uid), { inventory: weaponIds }); } catch (err) { console.warn(err); }
    }, 2500);
  }

  // Friends are looked up by the short game ID (e.g. "AN4821"), not the
  // long raw Firebase UID — see allocateGameId() below.
  async addFriendByGameId(gameId) {
    gameId = (gameId || '').trim().toUpperCase();
    if (!gameId) return;
    if (!this._canPersist()) throw new Error('Sign in with Google to add friends.');
    if (gameId === this.profile.gameId) throw new Error("That's your own ID.");
    const mapSnap = await getDoc(doc(fbDb, 'gameIds', gameId));
    if (!mapSnap.exists()) throw new Error('No player found with that ID.');
    const uid = mapSnap.data().uid;
    const friendSnap = await getDoc(doc(fbDb, 'players', uid));
    if (!friendSnap.exists()) throw new Error('No player found with that ID.');
    if (friendSnap.data().gameId && (this.profile.friends || []).some((f) => f.uid === uid)) {
      throw new Error('Already friends with that player.');
    }
    const friendName = friendSnap.data().displayName || 'Player';
    await updateDoc(doc(fbDb, 'players', this.user.uid), { friends: arrayUnion({ uid, gameId, name: friendName }) });
    this.profile.friends = this.profile.friends || [];
    this.profile.friends.push({ uid, gameId, name: friendName });
  }

  // Lightweight discovery record so a friend can see roughly where you are —
  // NOT the source of truth for room membership (the WS server owns that).
  async publishRoomPresence(code) {
    if (!this._canPersist()) return;
    try {
      await setDoc(doc(fbDb, 'rooms', code), {
        lastActive: Date.now(), hostUid: this.user.uid, hostName: this.profile?.displayName || 'Player',
      }, { merge: true });
    } catch (err) { console.warn(err); }
  }
}

// Short, human-typeable player ID: 2 letters (from the email/name) + a
// 4-digit number, e.g. "AN4821". A `gameIds/{id} -> {uid}` mapping doc
// claims each id atomically; on collision we try the next number, and if
// an entire letter pair is exhausted (10,000 ids — essentially never),
// we roll the second letter forward and start the numbers over again, per
// the same "increase the number or the letters" rule.
function _gameIdLetters(email, displayName) {
  const src = (email ? email.split('@')[0] : displayName) || 'PL';
  const letters = src.replace(/[^a-zA-Z]/g, '').toUpperCase().slice(0, 2);
  return (letters + 'XX').slice(0, 2);
}
async function allocateGameId(email, displayName, uid) {
  if (!fbDb) return null;
  const letters = _gameIdLetters(email, displayName).split('');
  for (let letterTry = 0; letterTry < 26; letterTry++) {
    for (let num = 0; num < 10000; num++) {
      const candidate = letters.join('') + String(num).padStart(4, '0');
      const ref = doc(fbDb, 'gameIds', candidate);
      try {
        const claimed = await runTransaction(fbDb, async (tx) => {
          const snap = await tx.get(ref);
          if (snap.exists()) return false;
          tx.set(ref, { uid });
          return true;
        });
        if (claimed) return candidate;
      } catch (err) { /* contention or rules issue — try the next number */ }
    }
    letters[1] = String.fromCharCode(((letters[1].charCodeAt(0) - 65 + 1) % 26) + 65);
  }
  throw new Error('Could not allocate a game ID.');
}

const SKY_VERTEX_SHADER = `
varying vec3 vWorldPosition;
void main() {
  vec4 worldPosition = modelMatrix * vec4(position, 1.0);
  vWorldPosition = worldPosition.xyz;
  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
}`;
const SKY_FRAGMENT_SHADER = `
uniform vec3 topColor;
uniform vec3 bottomColor;
uniform vec3 sunColor;
uniform vec3 sunDirection;
uniform float offset;
uniform float exponent;
varying vec3 vWorldPosition;
void main() {
  float h = normalize(vWorldPosition + offset).y;
  vec3 skyColor = mix(bottomColor, topColor, max(pow(max(h, 0.0), exponent), 0.0));
  float sunAmount = max(dot(normalize(vWorldPosition), sunDirection), 0.0);
  vec3 sunGlow = sunColor * pow(sunAmount, 8.0) * 0.6;
  gl_FragColor = vec4(skyColor + sunGlow, 1.0);
}`;
const SKY_PRESETS = {
  morning: { top: new THREE.Color(0x4a90d9), bottom: new THREE.Color(0xdff2ff), sun: new THREE.Color(0xfff0c0), sunAngle: 25, fogColor: 0xcfe6ff },
  evening: { top: new THREE.Color(0x2c3e6b), bottom: new THREE.Color(0xff8c5a), sun: new THREE.Color(0xff7043), sunAngle: 8, fogColor: 0xe8a273 },
  night:   { top: new THREE.Color(0x02030a), bottom: new THREE.Color(0x0a1030), sun: new THREE.Color(0x8fa8ff), sunAngle: -10, fogColor: 0x05070f },
};

const USE_IMAGE_SKYBOX = true;
const SKYBOX_PATH = 'Skybox/'; // put back.png, bottom.png, front.png, left.png, right.png, top.png here
const SKYBOX_FACES = ['right.png', 'left.png', 'top.png', 'bottom.png', 'front.png', 'back.png'];

class Skybox {
  constructor(scene, radius = 480) {
    this.scene = scene;
    this.timeOfDay = 'morning';
    if (USE_IMAGE_SKYBOX) this._buildImageSkybox(scene);
    else this._buildProceduralSkybox(scene, radius);
    this._buildClouds(radius);
  }

  _buildImageSkybox(scene) {
    const loader = new THREE.CubeTextureLoader();
    loader.setPath(SKYBOX_PATH);
    loader.load(
      SKYBOX_FACES,
      (cubeTexture) => {
        cubeTexture.colorSpace = THREE.SRGBColorSpace;
        scene.background = cubeTexture;
        if (this.mesh) { scene.remove(this.mesh); this.mesh = null; }
      },
      undefined,
      () => {
        console.warn('Skybox images not found at "' + SKYBOX_PATH + '" — using procedural sky instead.');
        this._buildProceduralSkybox(scene, 480);
      }
    );
  }

  _buildProceduralSkybox(scene, radius) {
    const geometry = new THREE.SphereGeometry(radius, 32, 16);
    this.uniforms = {
      topColor: { value: SKY_PRESETS.morning.top.clone() },
      bottomColor: { value: SKY_PRESETS.morning.bottom.clone() },
      sunColor: { value: SKY_PRESETS.morning.sun.clone() },
      sunDirection: { value: new THREE.Vector3(0, 1, 0) },
      offset: { value: 15 },
      exponent: { value: 0.6 },
    };
    const material = new THREE.ShaderMaterial({
      uniforms: this.uniforms, vertexShader: SKY_VERTEX_SHADER, fragmentShader: SKY_FRAGMENT_SHADER,
      side: THREE.BackSide, depthWrite: false, fog: false,
    });
    this.mesh = new THREE.Mesh(geometry, material);
    this.mesh.renderOrder = -1000;
    scene.add(this.mesh);
    this.setTimeOfDay('morning');
  }

  _buildClouds(radius) {
    this.cloudGroup = new THREE.Group();
    const cloudTexture = this._generateCloudTexture();
    const cloudMaterial = new THREE.SpriteMaterial({ map: cloudTexture, transparent: true, opacity: 0.75, depthWrite: false, fog: false });
    const cloudRadius = radius * 0.85;
    for (let i = 0; i < 26; i++) {
      const sprite = new THREE.Sprite(cloudMaterial.clone());
      const theta = Math.random() * Math.PI * 2;
      const heightFactor = 0.25 + Math.random() * 0.35;
      const y = cloudRadius * heightFactor;
      const horizontalR = Math.sqrt(Math.max(cloudRadius * cloudRadius - y * y, 0));
      sprite.position.set(Math.cos(theta) * horizontalR, y, Math.sin(theta) * horizontalR);
      const scale = 60 + Math.random() * 80;
      sprite.scale.set(scale, scale * 0.5, 1);
      sprite.userData.driftSpeed = 0.15 + Math.random() * 0.25;
      sprite.userData.baseTheta = theta;
      sprite.userData.horizontalR = horizontalR;
      this.cloudGroup.add(sprite);
    }
    this.scene.add(this.cloudGroup);
  }

  _generateCloudTexture() {
    const size = 128;
    const canvas = document.createElement('canvas');
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext('2d');
    const gradient = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
    gradient.addColorStop(0, 'rgba(255,255,255,0.9)');
    gradient.addColorStop(0.5, 'rgba(255,255,255,0.4)');
    gradient.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, size, size);
    const texture = new THREE.CanvasTexture(canvas);
    texture.needsUpdate = true;
    return texture;
  }

  setTimeOfDay(name) {
    const preset = SKY_PRESETS[name];
    if (!preset) return;
    this.timeOfDay = name;
    if (this.uniforms) {
      this.uniforms.topColor.value.copy(preset.top);
      this.uniforms.bottomColor.value.copy(preset.bottom);
      this.uniforms.sunColor.value.copy(preset.sun);
      const angleRad = THREE.MathUtils.degToRad(preset.sunAngle);
      this.uniforms.sunDirection.value.set(Math.cos(angleRad), Math.sin(angleRad), 0.3).normalize();
    }
    if (this.scene.fog) this.scene.fog.color.setHex(preset.fogColor);
  }

  update(delta) {
    if (!this.cloudGroup) return;
    for (const sprite of this.cloudGroup.children) {
      sprite.userData.baseTheta += sprite.userData.driftSpeed * delta * 0.02;
      const theta = sprite.userData.baseTheta;
      sprite.position.x = Math.cos(theta) * sprite.userData.horizontalR;
      sprite.position.z = Math.sin(theta) * sprite.userData.horizontalR;
    }
  }
}

  }

  _buildGround() {
    const size = CONFIG.world.groundSize;
    const repeat = CONFIG.world.groundTextureRepeat;
    const texture = this._generateGroundTexture();
    texture.wrapS = THREE.RepeatWrapping;
    texture.wrapT = THREE.RepeatWrapping;
    texture.repeat.set(repeat, repeat);
    texture.anisotropy = 8;

    const geometry = new THREE.PlaneGeometry(size, size, 1, 1);
    const material = new THREE.MeshStandardMaterial({ map: texture, roughness: 0.95, metalness: 0.02 });
    this.ground = new THREE.Mesh(geometry, material);
    this.ground.rotation.x = -Math.PI / 2;
    this.ground.receiveShadow = true;
    this.ground.userData.isGround = true;
    this.scene.add(this.ground);
    this.groundSize = size;
  }

  _generateGroundTexture() {
    const size = 256;
    const canvas = document.createElement('canvas');
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#8d9096';
    ctx.fillRect(0, 0, size, size);
    ctx.strokeStyle = '#6d7075';
    ctx.lineWidth = 3;
    ctx.strokeRect(0, 0, size, size);
    for (let i = 0; i < 400; i++) {
      ctx.fillStyle = `rgba(0,0,0,${Math.random() * 0.04})`;
      ctx.fillRect(Math.random() * size, Math.random() * size, 2, 2);
    }
    return new THREE.CanvasTexture(canvas);
  }

  _buildTestObjects() {
    const boxMat = new THREE.MeshStandardMaterial({ color: 0x5a6270, roughness: 0.8 });
    const rampMat = new THREE.MeshStandardMaterial({ color: 0x707680, roughness: 0.85 });
    const accentMat = new THREE.MeshStandardMaterial({ color: 0x2f6fed, roughness: 0.5, metalness: 0.1 });

    this._addBox([-14, 1, -4], [3, 2, 3], boxMat);
    this._addBox([14, 1.5, -6], [4, 3, 4], boxMat);
    this._addBox([-6, 0.5, 6], [1, 1, 1], boxMat);
    this._addBox([-4, 0.5, 6], [1, 1, 1], boxMat);
    this._addBox([-2, 0.5, 6], [1, 1, 1], boxMat);
    this._addBox([-20, 1, 0], [2.5, 2, 2.5], accentMat);
    this._addBox([20, 1, 0], [2.5, 2, 2.5], accentMat);
    this._buildStairs([0, 0, -18], 6, 0.35, 1.4, boxMat);
    this._addRamp([10, 0, 10], [6, 3, 6], 22, rampMat);
    this._addRamp([-10, 0, 14], [5, 2, 5], -18, rampMat);
    this._addBox([0, 2.1, -24], [8, 0.3, 6], boxMat);
  }

  _addBox(position, size, material) {
    const geometry = new THREE.BoxGeometry(size[0], size[1], size[2]);
    const mesh = new THREE.Mesh(geometry, material);
    mesh.position.set(position[0], position[1], position[2]);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    mesh.userData.collider = 'box';
    mesh.geometry.computeBoundingBox();
    this.scene.add(mesh);
    this.collidables.push(mesh);
    return mesh;
  }

  _addRamp(position, size, angleDeg, material) {
    const geometry = new THREE.BoxGeometry(size[0], size[1], size[2]);
    const mesh = new THREE.Mesh(geometry, material);
    mesh.position.set(position[0], size[1] / 2, position[2]);
    mesh.rotation.z = THREE.MathUtils.degToRad(angleDeg);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    mesh.userData.collider = 'ramp';
    mesh.userData.slopeAngle = Math.abs(angleDeg);
    mesh.geometry.computeBoundingBox();
    this.scene.add(mesh);
    this.collidables.push(mesh);
    this.ramps.push(mesh);
    return mesh;
  }

  _buildStairs(origin, steps, stepHeight, stepDepth, material) {
    for (let i = 0; i < steps; i++) {
      const geometry = new THREE.BoxGeometry(4, stepHeight * (i + 1), stepDepth);
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.set(origin[0], (stepHeight * (i + 1)) / 2, origin[2] - i * stepDepth);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      mesh.userData.collider = 'box';
      mesh.geometry.computeBoundingBox();
      this.scene.add(mesh);
      this.collidables.push(mesh);
    }
  }

  _buildDemoEnemies() {
    // Fixed ids + order so every client and the server agree on which bot
    // is which — required once bots become server-authoritative.
    const positions = [[-8, -10], [12, -14], [0, 14]];
    positions.forEach(([x, z], i) => this._spawnEnemy(x, z, 'bot_' + i));
  }

  _spawnEnemy(x, z, id) {
    const group = new THREE.Group();
    // Geometry is shared across bots (cheap, never mutated per-instance).
    // Material stays per-bot because hit-flash mutates `.emissive` directly
    // — sharing it would flash every bot at once.
    const mat = new THREE.MeshStandardMaterial({ color: 0xb33636, roughness: 0.6 });
    const torso = new THREE.Mesh(_botTorsoGeometry, mat);
    torso.position.y = 1.1;
    torso.castShadow = false; // server-driven bots: skip shadow casting, see RemotePlayer for why
    torso.receiveShadow = false;
    const head = new THREE.Mesh(_botHeadGeometry, mat);
    head.position.y = 1.7;
    head.castShadow = false;
    head.receiveShadow = false;
    group.add(torso, head);
    group.position.set(x, 0, z);
    this.scene.add(group);

    const enemy = {
      mesh: group, headMesh: head, bodyMesh: torso,
      health: 100, maxHealth: 100, alive: true,
      id: id || ('enemy_' + Math.random().toString(36).slice(2, 9)), label: 'Hostile',
      // Interpolation target — harmless no-ops in solo play (target just
      // equals spawn position); driven by server bot-state updates once a
      // MultiplayerManager is active. See World.update().
      targetPos: new THREE.Vector3(x, 0, z), targetYaw: 0, yaw: 0,
    };
    group.userData.entityType = 'enemy';
    group.userData.enemyRef = enemy;
    torso.userData.entityType = 'enemy';
    torso.userData.enemyRef = enemy;
    torso.userData.bodyPart = 'body';
    head.userData.entityType = 'enemy';
    head.userData.enemyRef = enemy;
    head.userData.bodyPart = 'head';

    this.enemies.push(enemy);
    return enemy;
  }

  removeEnemy(enemy) {
    this.scene.remove(enemy.mesh);
    this.enemies = this.enemies.filter((e) => e !== enemy);
  }

  getEnemyById(id) { return this.enemies.find((e) => e.id === id) || null; }

  _buildDemoPickups() {
    // Fixed ids (not random) so every client/server agrees on the same pickup
    // identity for the static map layout — required for multiplayer sync.
    this._spawnPickup({ id: 'static_0', type: 'weapon', weaponId: 'sword', label: 'Sword', position: [3, 0.4, 2] });
    this._spawnPickup({ id: 'static_1', type: 'weapon', weaponId: 'axe', label: 'Axe', position: [-9, 0.4, -2] });
    this._spawnPickup({ id: 'static_2', type: 'weapon', weaponId: 'spear', label: 'Spear', position: [16, 0.4, -8] });
    this._spawnPickup({ id: 'static_3', type: 'health', amount: 50, label: 'Health Pack', position: [-4, 0.4, 8] });
    this._spawnPickup({ id: 'static_4', type: 'coin', amount: 10, label: 'Coins', position: [0, 0.4, 3] });
    this._spawnPickup({ id: 'static_5', type: 'resource', amount: 5, label: 'Wood', position: [-2, 0.4, -8] });
  }

  getPickupById(id) { return this.pickups.find((p) => p.id === id) || null; }

  _spawnPickup({ id, type, weaponId, amount, label, position }) {
    const colorByType = { weapon: 0xffcc33, health: 0x33ff77, coin: 0xffe066, resource: 0xcc9966, quest: 0xff66cc };
    const geoByType = {
      weapon: new THREE.BoxGeometry(0.5, 0.18, 0.18),
      health: new THREE.BoxGeometry(0.32, 0.32, 0.32),
      coin: new THREE.CylinderGeometry(0.18, 0.18, 0.06, 16),
      resource: new THREE.BoxGeometry(0.3, 0.3, 0.3),
      quest: new THREE.OctahedronGeometry(0.24),
    };
    const mat = new THREE.MeshStandardMaterial({
      color: colorByType[type] ?? 0xffffff,
      emissive: colorByType[type] ?? 0x000000,
      emissiveIntensity: 0.35, roughness: 0.4, metalness: 0.3,
    });
    const mesh = new THREE.Mesh(geoByType[type] ?? geoByType.resource, mat);
    mesh.position.set(position[0], position[1], position[2]);
    mesh.castShadow = true;
    this.scene.add(mesh);

    const pickup = {
      id: id || ('pickup_' + Math.random().toString(36).slice(2, 9)),
      type, weaponId, amount, label, mesh, baseY: position[1], collected: false,
    };
    mesh.userData.entityType = 'pickup';
    mesh.userData.pickupRef = pickup;
    this.pickups.push(pickup);
    return pickup;
  }

  removePickup(pickup) {
    this.scene.remove(pickup.mesh);
    this.pickups = this.pickups.filter((p) => p !== pickup);
  }

  addDroppedItem(pickupData) { return this._spawnPickup(pickupData); }

  update(delta, elapsed) {
    this.skybox.update(delta);
    for (const pickup of this.pickups) {
      pickup.mesh.position.y = pickup.baseY + Math.sin(elapsed * 2 + pickup.mesh.position.x) * 0.08;
      pickup.mesh.rotation.y += delta * 1.4;
    }
    for (const enemy of this.enemies) {
      if (!enemy.alive) continue;
      // Smoothly chase the last server-reported bot transform. In solo
      // play targetPos never moves from the spawn point, so this is a no-op.
      const lerpRate = 8;
      enemy.mesh.position.x = THREE.MathUtils.damp(enemy.mesh.position.x, enemy.targetPos.x, lerpRate, delta);
      enemy.mesh.position.z = THREE.MathUtils.damp(enemy.mesh.position.z, enemy.targetPos.z, lerpRate, delta);
      let diff = enemy.targetYaw - enemy.yaw;
      while (diff > Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      enemy.yaw += diff * (1 - Math.exp(-lerpRate * delta));
      enemy.mesh.rotation.y = enemy.yaw;
    }
  }

  setTimeOfDay(name) {
    this.skybox.setTimeOfDay(name);
    const preset = { morning: 2.4, evening: 1.6, night: 0.15 }[name] ?? 2.0;
    this.sun.intensity = preset;
  }
}

const UP = new THREE.Vector3(0, 1, 0);
const _rayOrigin = new THREE.Vector3();
const _rayDown = new THREE.Vector3(0, -1, 0);
const _groundRaycaster = new THREE.Raycaster();
_groundRaycaster.far = 20;

class PhysicsWorld {
  constructor(world) {
    this.world = world;
    this._boxCache = new Map();
    for (const mesh of world.collidables) {
      if (mesh.userData.collider === 'box') this._boxCache.set(mesh, new THREE.Box3().setFromObject(mesh));
    }
  }

  _nearby(position, radius) {
    const out = [];
    for (const mesh of this.world.collidables) {
      const dx = mesh.position.x - position.x;
      const dz = mesh.position.z - position.z;
      if (dx * dx + dz * dz < (radius + 8) * (radius + 8)) out.push(mesh);
    }
    return out;
  }

  resolveHorizontal(position, radius) {
    for (const mesh of this._nearby(position, radius)) {
      if (mesh.userData.collider !== 'box') continue;
      const box = this._boxCache.get(mesh);
      const closestX = THREE.MathUtils.clamp(position.x, box.min.x, box.max.x);
      const closestZ = THREE.MathUtils.clamp(position.z, box.min.z, box.max.z);
      const dx = position.x - closestX;
      const dz = position.z - closestZ;
      const distSq = dx * dx + dz * dz;
      if (distSq < radius * radius) {
        const feetY = position.y;
        const headY = position.y + CONFIG.player.height;
        if (headY < box.min.y + 0.02 || feetY > box.max.y - 0.02) continue;
        const dist = Math.sqrt(distSq) || 0.0001;
        const pushOut = radius - dist;
        position.x += (dx / dist) * pushOut;
        position.z += (dz / dist) * pushOut;
      }
    }
    const half = this.world.groundSize / 2 - radius;
    position.x = THREE.MathUtils.clamp(position.x, -half, half);
    position.z = THREE.MathUtils.clamp(position.z, -half, half);
  }

  sampleGroundHeight(position) {
    _rayOrigin.set(position.x, position.y + 5, position.z);
    _groundRaycaster.set(_rayOrigin, _rayDown);
    const targets = this._nearby(position, 2);
    targets.push(this.world.ground);
    const hits = _groundRaycaster.intersectObjects(targets, false);
    if (hits.length === 0) return null;
    const hit = hits[0];
    const normal = hit.face ? hit.face.normal.clone().transformDirection(hit.object.matrixWorld) : UP.clone();
    const slopeAngle = THREE.MathUtils.radToDeg(normal.angleTo(UP));
    return { height: hit.point.y, normal, isRamp: hit.object.userData.collider === 'ramp', slopeAngle };
  }
}

const _forward = new THREE.Vector3();
const _right = new THREE.Vector3();
const _moveDir = new THREE.Vector3();
const _targetVel = new THREE.Vector3();

class Player {
  constructor(scene, physics) {
    this.physics = physics;
    this.position = new THREE.Vector3(0, 2, 6);
    this.velocity = new THREE.Vector3();
    this.yaw = Math.PI;
    this.grounded = false;
    this.jumpQueued = false;
    this._canJump = true;
    this.currentSpeed = 0;

    // Dash / dodge roll state
    this.dashQueued = false;
    this.isDashing = false;
    this.isInvincible = false;
    this._dashTimer = 0;
    this._dashCooldownTimer = 0;
    this._dashDir = new THREE.Vector3();
    this._dashAttackWindowTimer = 0; // counts down after a dash finishes; an attack landed inside this window gets doubled

    // Crouch state
    this.crouchHeld = false;
    this.isCrouching = false;
    this._crouchAmount = 0; // 0 = standing, 1 = fully crouched, eased for smooth transition

    // Multiplayer: local player's own health. Only meaningful once a
    // MultiplayerManager is active; server is authoritative over the value.
    this.health = 100;
    this.maxHealth = 100;
    this.alive = true;
    this.id = null; // assigned by the server on join

    this._buildVisual(scene);
  }

  takeDamage(amount) {
    if (!this.alive) return this.health;
    this.health = Math.max(0, this.health - amount);
    return this.health;
  }

  respawn(position) {
    this.position.copy(position);
    this.velocity.set(0, 0, 0);
    this.health = this.maxHealth;
    this.alive = true;
    this.mesh.visible = true;
  }

  _buildVisual(scene) {
    this.mesh = new THREE.Group();
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0xd8d8de, roughness: 0.5, metalness: 0.15 });
    const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.28, 0.75, 4, 8), bodyMat);
    torso.position.y = 1.05;
    torso.castShadow = true;
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.22, 16, 16), bodyMat);
    head.position.y = 1.62;
    head.castShadow = true;
    this.mesh.add(torso, head);
    this.mesh.position.copy(this.position);
    scene.add(this.mesh);
    this.headHeight = CONFIG.camera.firstPerson.headHeight;
  }

  requestJump() { this.jumpQueued = true; }

  requestDash() { this.dashQueued = true; }

  setCrouch(held) { this.crouchHeld = held; }

  get dashCooldownRemaining() { return Math.max(0, this._dashCooldownTimer); }
  get dashReady() { return this._dashCooldownTimer <= 0 && !this.isDashing; }
  get isInDashAttackWindow() { return this._dashAttackWindowTimer > 0; }
  consumeDashAttackWindow() { this._dashAttackWindowTimer = 0; }

  update(delta, moveInput, running, cameraYaw) {
    const cfg = CONFIG.player;
    const ground = this.physics.sampleGroundHeight(this.position);
    const groundHeight = ground ? ground.height : 0;
    const distToGround = this.position.y - groundHeight;
    this.grounded = distToGround <= 0.08 && this.velocity.y <= 0.01;

    _forward.set(Math.sin(cameraYaw), 0, Math.cos(cameraYaw));
    _right.set(-Math.cos(cameraYaw), 0, Math.sin(cameraYaw));

    _moveDir.set(0, 0, 0);
    _moveDir.addScaledVector(_forward, moveInput.y);
    _moveDir.addScaledVector(_right, moveInput.x);

    const hasInput = _moveDir.lengthSq() > 0.0001;
    if (hasInput) _moveDir.normalize();

    // --- Dash / dodge roll ---
    // Cooldown and active-dash timers always tick down, even mid-frame,
    // so dashReady/isInvincible stay accurate for other systems (damage, UI).
    if (this._dashCooldownTimer > 0) this._dashCooldownTimer -= delta;
    if (this._dashAttackWindowTimer > 0) this._dashAttackWindowTimer -= delta;

    if (this.dashQueued && this.dashReady && this.grounded) {
      this.isDashing = true;
      this._dashTimer = cfg.dashDuration;
      this._dashCooldownTimer = cfg.dashCooldown;
      this.isInvincible = true;
      this._dashAttackWindowTimer = cfg.dashCooldown;
      // Dash toward current movement input if pressed, otherwise dash forward
      // in the direction the player is already facing (classic dodge-roll feel).
      if (hasInput) this._dashDir.copy(_moveDir);
      else this._dashDir.set(Math.sin(this.yaw), 0, Math.cos(this.yaw));
    }
    this.dashQueued = false;

    if (this.isDashing) {
      this._dashTimer -= delta;
      if (this._dashTimer <= cfg.dashDuration - cfg.dashIFrames) this.isInvincible = false;
      if (this._dashTimer <= 0) {
        this.isDashing = false;
        this.isInvincible = false;
      }
    }

    // Crouch: can't crouch while dashing; releases automatically on dash.
    this.isCrouching = this.crouchHeld && !this.isDashing;
    this._crouchAmount = THREE.MathUtils.damp(this._crouchAmount, this.isCrouching ? 1 : 0, cfg.crouchTransitionSpeed, delta);

    const targetSpeed = (running ? cfg.runSpeed : cfg.walkSpeed) * (this.isCrouching ? cfg.crouchSpeedMultiplier : 1);
    _targetVel.copy(_moveDir).multiplyScalar(hasInput ? targetSpeed : 0);

    if (this.isDashing) {
      // Dash overrides normal accel/decel with a snappy burst velocity.
      this.velocity.x = this._dashDir.x * cfg.dashSpeed;
      this.velocity.z = this._dashDir.z * cfg.dashSpeed;
    } else {
      const control = this.grounded ? 1 : cfg.airControl;
      const rate = (hasInput ? cfg.acceleration : cfg.deceleration) * control;
      this.velocity.x = THREE.MathUtils.damp(this.velocity.x, _targetVel.x, rate, delta);
      this.velocity.z = THREE.MathUtils.damp(this.velocity.z, _targetVel.z, rate, delta);
    }

    if (this.jumpQueued && this.grounded && this._canJump) {
      this.velocity.y = cfg.jumpForce;
      this.grounded = false;
      this._canJump = false;
    }
    if (!this.jumpQueued) this._canJump = true;
    this.jumpQueued = false;

    if (!this.grounded) this.velocity.y += cfg.gravity * delta;
    else if (this.velocity.y < 0) this.velocity.y = 0;

    this.position.x += this.velocity.x * delta;
    this.position.z += this.velocity.z * delta;
    this.physics.resolveHorizontal(this.position, cfg.radius);
    this.position.y += this.velocity.y * delta;

    const groundAfter = this.physics.sampleGroundHeight(this.position);
    if (groundAfter) {
      const heightDiff = groundAfter.height - this.position.y;
      const withinStep = heightDiff <= cfg.maxStepHeight && heightDiff > -0.5;
      if (this.velocity.y <= 0 && withinStep && (groundAfter.slopeAngle <= cfg.maxSlopeAngle)) {
        this.position.y = THREE.MathUtils.damp(this.position.y, groundAfter.height, 20, delta);
        this.velocity.y = 0;
        this.grounded = true;
      } else if (this.position.y < groundAfter.height - 0.5) {
        this.position.y = groundAfter.height;
        this.velocity.y = 0;
        this.grounded = true;
      }
    }

    if (this.position.y < -20) {
      this.position.set(0, 3, 6);
      this.velocity.set(0, 0, 0);
    }

    if (hasInput) {
      const targetYaw = Math.atan2(_moveDir.x, _moveDir.z);
      this.yaw = this._dampAngle(this.yaw, targetYaw, cfg.turnSmoothing, delta);
    }

    this.currentSpeed = Math.hypot(this.velocity.x, this.velocity.z);
    this.mesh.position.copy(this.position);
    this.mesh.rotation.y = this.yaw;

    // Crouch visual: squash the body mesh and drop eye height, smoothly.
    const crouchScale = 1 - this._crouchAmount * 0.35;
    this.mesh.scale.y = crouchScale;
    this.currentEyeHeight = this.headHeight - this._crouchAmount * (this.headHeight - CONFIG.player.crouchHeight);

    // Quick forward tilt while dashing/rolling, eased back to upright when done.
    const targetTilt = this.isDashing ? 0.5 : 0;
    this.mesh.rotation.x = THREE.MathUtils.damp(this.mesh.rotation.x, targetTilt, 14, delta);
  }

  _dampAngle(current, target, rate, delta) {
    let diff = target - current;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    return current + diff * (1 - Math.exp(-rate * delta));
  }

  getHeadPosition(out) {
    const eyeHeight = this.currentEyeHeight ?? this.headHeight;
    out.set(this.position.x, this.position.y + eyeHeight, this.position.z);
    return out;
  }

  setVisualVisible(visible) { this.mesh.visible = visible; }
}

const _idealPos = new THREE.Vector3();
const _headPos = new THREE.Vector3();
const _rayDir = new THREE.Vector3();
const _raycaster = new THREE.Raycaster();
const CameraMode = { FIRST_PERSON: 'first', THIRD_PERSON: 'third' };

class CameraRig {
  constructor(camera, player, world) {
    this.camera = camera;
    this.player = player;
    this.world = world;
    this.mode = CameraMode.THIRD_PERSON;
    this.pitch = 0.18;
    this.yaw = player.yaw;
    this.currentDistance = CONFIG.camera.thirdPerson.distance;
    player.setVisualVisible(true);
  }

  toggleMode() {
    this.mode = this.mode === CameraMode.THIRD_PERSON ? CameraMode.FIRST_PERSON : CameraMode.THIRD_PERSON;
  }

  applyLook(dx, dy) {
    this.yaw -= dx;
    this.pitch -= dy;
    const minP = THREE.MathUtils.degToRad(CONFIG.camera.verticalMinDeg);
    const maxP = THREE.MathUtils.degToRad(CONFIG.camera.verticalMaxDeg);
    this.pitch = THREE.MathUtils.clamp(this.pitch, minP, maxP);
  }

  update(delta) {
    const targetDistance = this.mode === CameraMode.THIRD_PERSON ? CONFIG.camera.thirdPerson.distance : 0;
    this.currentDistance = THREE.MathUtils.damp(this.currentDistance, targetDistance, CONFIG.camera.switchLerp, delta);
    this.player.setVisualVisible(this.currentDistance > 0.35);
    this.player.getHeadPosition(_headPos);

    const dirX = Math.sin(this.yaw) * Math.cos(this.pitch);
    const dirY = Math.sin(this.pitch);
    const dirZ = Math.cos(this.yaw) * Math.cos(this.pitch);

    if (this.currentDistance > 0.35) {
      _idealPos.set(
        _headPos.x - dirX * this.currentDistance,
        _headPos.y - dirY * this.currentDistance + CONFIG.camera.thirdPerson.height * 0.15,
        _headPos.z - dirZ * this.currentDistance
      );
      const safeDistance = this._avoidWallClipping(_headPos, _idealPos);
      this.camera.position.lerp(
        new THREE.Vector3(
          _headPos.x - dirX * safeDistance,
          _headPos.y - dirY * safeDistance + CONFIG.camera.thirdPerson.height * 0.15,
          _headPos.z - dirZ * safeDistance
        ),
        Math.min(1, CONFIG.camera.thirdPerson.followLerp * delta)
      );
    } else {
      this.camera.position.copy(_headPos);
    }

    const minCamY = this.player.position.y + 0.15;
    if (this.camera.position.y < minCamY) this.camera.position.y = minCamY;

    const lookTarget = new THREE.Vector3(
      this.camera.position.x + dirX, this.camera.position.y + dirY, this.camera.position.z + dirZ
    );
    this.camera.lookAt(lookTarget);
  }

  _avoidWallClipping(from, idealPos) {
    _rayDir.subVectors(idealPos, from).normalize();
    const maxDist = from.distanceTo(idealPos);
    _raycaster.set(from, _rayDir);
    _raycaster.far = maxDist;
    _raycaster.near = 0;
    const hits = _raycaster.intersectObjects(this.world.collidables, false);
    if (hits.length > 0) {
      return Math.max(hits[0].distance - CONFIG.camera.thirdPerson.collisionPadding, CONFIG.camera.thirdPerson.minDistance);
    }
    return maxDist;
  }

  getYaw() { return this.yaw; }
}

class InputManager {
  constructor(canvas) {
    this.canvas = canvas;
    this.isMobile = this._detectMobile();
    this.state = {
      moveX: 0, moveY: 0, running: false, jumpPressed: false,
      lookDeltaX: 0, lookDeltaY: 0, camToggleRequested: false,
      pickupRequested: false, dropRequested: false,
      inventoryToggleRequested: false, attackRequested: false,
      dashRequested: false, crouchHeld: false,
    };
    this._keys = new Set();
    this._pointerLocked = false;
    this._joystick = { active: false, pointerId: null, originX: 0, originY: 0, dx: 0, dy: 0 };
    this._look = { active: false, pointerId: null, lastX: 0, lastY: 0 };
    this._lastTapTime = 0;

    this._bindKeyboardMouse();
    if (this.isMobile) this._bindTouchControls();
    document.getElementById('mobile-controls').classList.toggle('active', this.isMobile);
  }

  _detectMobile() {
    return /Android|iPhone|iPad|iPod|Mobi/i.test(navigator.userAgent) || 'ontouchstart' in window;
  }

  _bindKeyboardMouse() {
    window.addEventListener('keydown', (e) => {
      this._keys.add(e.code);
      if (e.code === 'KeyC') this.state.camToggleRequested = true;
      if (e.code === 'KeyE') this.state.pickupRequested = true;
      if (e.code === 'KeyG') this.state.dropRequested = true;
      if (e.code === 'KeyI' || e.code === 'Tab') { e.preventDefault(); this.state.inventoryToggleRequested = true; }
      if (e.code === 'KeyQ' || e.code === 'ControlLeft') this.state.dashRequested = true;
    });
    window.addEventListener('keyup', (e) => this._keys.delete(e.code));

    this.canvas.addEventListener('click', () => {
      if (!this.isMobile) this.canvas.requestPointerLock?.();
    });
    document.addEventListener('pointerlockchange', () => {
      this._pointerLocked = document.pointerLockElement === this.canvas;
    });
    window.addEventListener('mousemove', (e) => {
      if (!this._pointerLocked) return;
      this.state.lookDeltaX += e.movementX * CONFIG.input.mouseSensitivity;
      this.state.lookDeltaY += e.movementY * CONFIG.input.mouseSensitivity;
    });
    window.addEventListener('mousedown', (e) => {
      if (this.isMobile || !this._pointerLocked) return;
      if (e.button === 0) this.state.attackRequested = true;
    });
    window.addEventListener('dblclick', (e) => {
      if (this.isMobile || !this._pointerLocked) return;
      if (e.button === 0) { this.state.pickupRequested = true; this.state.attackRequested = false; }
    });
    window.addEventListener('contextmenu', (e) => { if (this._pointerLocked) e.preventDefault(); });

    document.getElementById('cam-switch-btn').addEventListener('click', () => { this.state.camToggleRequested = true; });
    document.getElementById('inventory-btn').addEventListener('click', () => { this.state.inventoryToggleRequested = true; });
    const crouchBtn = document.getElementById('crouch-btn');
    crouchBtn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      this.state.crouchHeld = !this.state.crouchHeld;
      crouchBtn.classList.toggle('active', this.state.crouchHeld);
    });
  }

  _readKeyboardMovement() {
    let x = 0, y = 0;
    if (this._keys.has('KeyW') || this._keys.has('ArrowUp')) y += 1;
    if (this._keys.has('KeyS') || this._keys.has('ArrowDown')) y -= 1;
    if (this._keys.has('KeyD') || this._keys.has('ArrowRight')) x += 1;
    if (this._keys.has('KeyA') || this._keys.has('ArrowLeft')) x -= 1;
    const len = Math.hypot(x, y);
    if (len > 1) { x /= len; y /= len; }
    this.state.moveX = x;
    this.state.moveY = y;
    this.state.running = this._keys.has('ShiftLeft') || this._keys.has('ShiftRight');
    this.state.jumpPressed = this._keys.has('Space');
    this.state.crouchHeld = this._keys.has('KeyZ') || this._keys.has('ControlRight');
  }

  _bindTouchControls() {
    const joystickZone = document.getElementById('joystick-zone');
    const joystickKnob = document.getElementById('joystick-knob');
    const joystickBase = document.getElementById('joystick-base');
    const lookZone = document.getElementById('look-zone');
    const jumpBtn = document.getElementById('jump-btn');
    const dashBtn = document.getElementById('dash-btn');
    const maxRadius = 45;

    joystickZone.addEventListener('pointerdown', (e) => {
      this._joystick.active = true;
      this._joystick.pointerId = e.pointerId;
      const rect = joystickBase.getBoundingClientRect();
      this._joystick.originX = rect.left + rect.width / 2;
      this._joystick.originY = rect.top + rect.height / 2;
      joystickZone.setPointerCapture(e.pointerId);
    });
    joystickZone.addEventListener('pointermove', (e) => {
      if (!this._joystick.active || e.pointerId !== this._joystick.pointerId) return;
      let dx = e.clientX - this._joystick.originX;
      let dy = e.clientY - this._joystick.originY;
      const dist = Math.hypot(dx, dy);
      if (dist > maxRadius) { dx = (dx / dist) * maxRadius; dy = (dy / dist) * maxRadius; }
      this._joystick.dx = dx / maxRadius;
      this._joystick.dy = dy / maxRadius;
      joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
    });
    const releaseJoystick = (e) => {
      if (this._joystick.pointerId !== null && e.pointerId !== this._joystick.pointerId) return;
      this._joystick.active = false;
      this._joystick.pointerId = null;
      this._joystick.dx = 0;
      this._joystick.dy = 0;
      joystickKnob.style.transform = 'translate(0px, 0px)';
    };
    joystickZone.addEventListener('pointerup', releaseJoystick);
    joystickZone.addEventListener('pointercancel', releaseJoystick);
    joystickZone.addEventListener('pointerleave', releaseJoystick);

    lookZone.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const t = e.changedTouches[0];
      this._look.active = true;
      this._look.pointerId = t.identifier;
      this._look.lastX = t.clientX;
      this._look.lastY = t.clientY;
      this._look.startX = t.clientX;
      this._look.startY = t.clientY;
      this._look.startTime = performance.now();
      this._look.moved = false;
    }, { passive: false });

    lookZone.addEventListener('touchmove', (e) => {
      e.preventDefault();
      if (!this._look.active) return;
      let touch = null;
      for (const t of e.changedTouches) {
        if (t.identifier === this._look.pointerId) { touch = t; break; }
      }
      if (!touch) return;
      const dx = touch.clientX - this._look.lastX;
      const dy = touch.clientY - this._look.lastY;
      this._look.lastX = touch.clientX;
      this._look.lastY = touch.clientY;
      if (Math.hypot(touch.clientX - this._look.startX, touch.clientY - this._look.startY) > 12) {
        this._look.moved = true;
      }
      this.state.lookDeltaX += dx * CONFIG.input.touchLookSensitivity;
      this.state.lookDeltaY += dy * CONFIG.input.touchLookSensitivity;
    }, { passive: false });

    const releaseLookTouch = (e) => {
      for (const t of e.changedTouches) {
        if (t.identifier === this._look.pointerId) {
          this._look.active = false;
          this._look.pointerId = null;

          // A quick tap that didn't drag = attack whatever the crosshair is over.
          // A second quick tap within 300ms of the last one = pickup instead.
          const heldTime = performance.now() - this._look.startTime;
          if (!this._look.moved && heldTime < 250) {
            const now = performance.now();
            if (now - this._lastTapTime < 300) {
              this.state.pickupRequested = true;
              this._lastTapTime = 0;
            } else {
              this.state.attackRequested = true;
              this._lastTapTime = now;
            }
          }
          break;
        }
      }
    };
    lookZone.addEventListener('touchend', releaseLookTouch, { passive: true });
    lookZone.addEventListener('touchcancel', releaseLookTouch, { passive: true });

    jumpBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); this.state.jumpPressed = true; });
    jumpBtn.addEventListener('pointerup', () => { this.state.jumpPressed = false; });
    jumpBtn.addEventListener('pointercancel', () => { this.state.jumpPressed = false; });

    dashBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); this.state.dashRequested = true; });
  }

  _readJoystickMovement() {
    const { dx, dy } = this._joystick;
    const magnitude = Math.hypot(dx, dy);
    if (magnitude < CONFIG.input.joystickDeadzone) {
      this.state.moveX = 0; this.state.moveY = 0; this.state.running = false;
      return;
    }
    this.state.moveX = dx;
    this.state.moveY = -dy;
    this.state.running = magnitude > CONFIG.input.joystickRunThreshold;
  }

  update() {
    if (this.isMobile) this._readJoystickMovement();
    else this._readKeyboardMovement();
  }

  consumeLookDelta() {
    const dx = this.state.lookDeltaX, dy = this.state.lookDeltaY;
    this.state.lookDeltaX = 0; this.state.lookDeltaY = 0;
    return { dx, dy };
  }
  consumeCamToggle() { const v = this.state.camToggleRequested; this.state.camToggleRequested = false; return v; }
  consumePickupRequested() { const v = this.state.pickupRequested; this.state.pickupRequested = false; return v; }
  consumeDropRequested() { const v = this.state.dropRequested; this.state.dropRequested = false; return v; }
  consumeInventoryToggle() { const v = this.state.inventoryToggleRequested; this.state.inventoryToggleRequested = false; return v; }
  consumeAttackRequested() { const v = this.state.attackRequested; this.state.attackRequested = false; return v; }
  consumeDashRequested() { const v = this.state.dashRequested; this.state.dashRequested = false; return v; }
}

class Controls {
  constructor(input, player, cameraRig) {
    this.input = input;
    this.player = player;
    this.cameraRig = cameraRig;
  }
  update(delta) {
    this.input.update();
    const { dx, dy } = this.input.consumeLookDelta();
    if (dx !== 0 || dy !== 0) this.cameraRig.applyLook(dx, dy);
    if (this.input.consumeCamToggle()) this.cameraRig.toggleMode();
    if (this.input.state.jumpPressed) this.player.requestJump();
    if (this.input.consumeDashRequested()) this.player.requestDash();
    this.player.setCrouch(this.input.state.crouchHeld);
    const moveInput = { x: this.input.state.moveX, y: this.input.state.moveY };
    const running = this.input.state.running;
    this.player.update(delta, moveInput, running, this.cameraRig.getYaw());
  }
}

class Engine {
  constructor({ onUpdate, onRender }) {
    this.onUpdate = onUpdate;
    this.onRender = onRender;
    this.running = false;
    this._lastTime = performance.now();
    this._fpsFrames = 0;
    this._fpsLast = performance.now();
    this.fps = 60;
  }
  start() {
    this.running = true;
    this._lastTime = performance.now();
    requestAnimationFrame((t) => this._loop(t));
  }
  _loop(now) {
    if (!this.running) return;
    let delta = (now - this._lastTime) / 1000;
    this._lastTime = now;
    delta = Math.min(delta, 1 / 20);
    this.onUpdate(delta);
    this.onRender();
    this._fpsFrames++;
    if (now - this._fpsLast >= 500) {
      this.fps = Math.round((this._fpsFrames * 1000) / (now - this._fpsLast));
      this._fpsFrames = 0;
      this._fpsLast = now;
    }
    requestAnimationFrame((t) => this._loop(t));
  }
}

class EventBus {
  constructor() { this._listeners = new Map(); }
  on(event, fn) {
    if (!this._listeners.has(event)) this._listeners.set(event, []);
    this._listeners.get(event).push(fn);
    return () => this.off(event, fn);
  }
  off(event, fn) {
    const arr = this._listeners.get(event);
    if (!arr) return;
    const i = arr.indexOf(fn);
    if (i >= 0) arr.splice(i, 1);
  }
  emit(event, payload) {
    const arr = this._listeners.get(event);
    if (!arr) return;
    for (const fn of arr.slice()) fn(payload);
  }
}

const WEAPON_BASE = {
  id: 'base', name: 'Unknown', type: 'melee',
  damage: 20, headMultiplier: 2.0, limbMultiplier: 0.7,
  attackRate: 500, range: 2.2, color: 0xaaaaaa,
};

const WEAPON_DATABASE = {
  sword: { ...WEAPON_BASE, id: 'sword', name: 'Sword', damage: 28, attackRate: 450, range: 2.2, color: 0xc0c0c0 },
  axe:   { ...WEAPON_BASE, id: 'axe',   name: 'Axe',   damage: 40, attackRate: 700, range: 2.0, color: 0x8a5a2b },
  spear: { ...WEAPON_BASE, id: 'spear', name: 'Spear', damage: 22, attackRate: 380, range: 2.8, color: 0x6b4a2a },
  dagger:{ ...WEAPON_BASE, id: 'dagger',name: 'Dagger',damage: 16, attackRate: 260, range: 1.6, color: 0xb0b0b0 },
