function createWeaponInstance(weaponId) {
  const template = WEAPON_DATABASE[weaponId];
  if (!template) return null;
  return { ...template, lastAttackTime: -Infinity };
}

class RaycastManager {
  constructor(camera, world) {
    this.camera = camera;
    this.world = world;
    this.raycaster = new THREE.Raycaster();
    this.lastHit = null;
    this._targetsDirty = true;
    this._cachedTargets = [];
  }
  markDirty() { this._targetsDirty = true; }
  _rebuildTargets() {
    const targets = [];
    for (const e of this.world.enemies) targets.push(e.headMesh, e.bodyMesh);
    for (const rp of this.world.remotePlayers) targets.push(rp.headMesh, rp.bodyMesh);
    for (const p of this.world.pickups) targets.push(p.mesh);
    for (const c of this.world.collidables) targets.push(c);
    targets.push(this.world.ground);
    this._cachedTargets = targets;
    this._targetsDirty = false;
  }
  queryCenter(maxDistance = 100) {
    if (this._targetsDirty) this._rebuildTargets();
    this.raycaster.setFromCamera({ x: 0, y: 0 }, this.camera);
    this.raycaster.far = maxDistance;
    const hits = this.raycaster.intersectObjects(this._cachedTargets, false);
    this.lastHit = hits.length > 0 ? hits[0] : null;
    return this.lastHit;
  }
  classifyHit(hit) {
    if (!hit) return { kind: 'none' };
    const obj = hit.object;
    if (obj.userData.entityType === 'enemy') return { kind: 'enemy', enemy: obj.userData.enemyRef, bodyPart: obj.userData.bodyPart, hit };
    if (obj.userData.entityType === 'remotePlayer') return { kind: 'remotePlayer', remotePlayer: obj.userData.remotePlayerRef, bodyPart: obj.userData.bodyPart, hit };
    if (obj.userData.entityType === 'pickup') return { kind: 'pickup', pickup: obj.userData.pickupRef, hit };
    if (obj.userData.isGround) return { kind: 'ground', hit };
    if (obj.userData.collider) return { kind: 'wall', hit };
    return { kind: 'other', hit };
  }
}

class PointerManager {
  constructor(raycastManager, player) {
    this.raycastManager = raycastManager;
    this.player = player;
    this.el = document.getElementById('crosshair');
    this._swingTimer = 0;
  }
  update(delta, isAttacking) {
    const hit = this.raycastManager.queryCenter(100);
    const info = this.raycastManager.classifyHit(hit);
    this.el.classList.toggle('target-lock', info.kind === 'enemy');

    const movementExpand = Math.min(1, this.player.currentSpeed / 6);
    this.el.classList.toggle('expanded', movementExpand > 0.3);

    if (isAttacking) { this.el.classList.add('swing'); this._swingTimer = 0.15; }
    if (this._swingTimer > 0) {
      this._swingTimer -= delta;
      if (this._swingTimer <= 0) this.el.classList.remove('swing');
    }
    return info;
  }
}

class DamageManager {
  constructor(eventBus, world) {
    this.bus = eventBus;
    this.world = world;
  }
  applyHit(weapon, hitInfo, bonusMultiplier = 1) {
    if (hitInfo.kind !== 'enemy') return null;
    const enemy = hitInfo.enemy;
    if (!enemy.alive) return null;

    const partMultiplier = hitInfo.bodyPart === 'head' ? weapon.headMultiplier
      : hitInfo.bodyPart === 'limb' ? weapon.limbMultiplier : 1;
    const damage = Math.round(weapon.damage * partMultiplier * bonusMultiplier);
    enemy.health = Math.max(0, enemy.health - damage);
    this.bus.emit('hit', { enemy, damage, bodyPart: hitInfo.bodyPart, headshot: hitInfo.bodyPart === 'head', comboBonus: bonusMultiplier > 1 });

    const mat = enemy.bodyMesh.material;
    const originalEmissive = mat.emissive.getHex();
    mat.emissive.setHex(0xff2222);
    mat.emissiveIntensity = 0.9;
    setTimeout(() => { mat.emissive.setHex(originalEmissive); mat.emissiveIntensity = 0; }, 90);

    if (enemy.health <= 0 && enemy.alive) {
      enemy.alive = false;
      this.bus.emit('death', { enemy });
      enemy.mesh.rotation.z = Math.PI / 2.2;
      enemy.mesh.position.y = 0.2;
      setTimeout(() => this.world.removeEnemy(enemy), 2500);
    }
    return { damage, headshot: hitInfo.bodyPart === 'head', comboBonus: bonusMultiplier > 1 };
  }
}

class WeaponManager {
  constructor(eventBus) {
    this.bus = eventBus;
    this.inventory = [];
    this.equippedIndex = -1;
  }
  get equipped() { return this.equippedIndex >= 0 ? this.inventory[this.equippedIndex] : null; }

  addWeapon(weaponId) {
    const existing = this.inventory.find((w) => w.id === weaponId);
    if (existing) { this.bus.emit('inventory-changed', { inventory: this.inventory }); return existing; }
    const weapon = createWeaponInstance(weaponId);
    this.inventory.push(weapon);
    if (this.equippedIndex === -1) this.equip(this.inventory.length - 1);
    this.bus.emit('inventory-changed', { inventory: this.inventory });
    return weapon;
  }

  equip(index) {
    if (index < 0 || index >= this.inventory.length) return;
    this.equippedIndex = index;
    this.bus.emit('weapon-equipped', { weapon: this.equipped });
  }

  dropEquipped() {
    if (!this.equipped) return null;
    const dropped = this.inventory.splice(this.equippedIndex, 1)[0];
    this.equippedIndex = this.inventory.length > 0 ? 0 : -1;
    this.bus.emit('inventory-changed', { inventory: this.inventory });
    this.bus.emit('weapon-equipped', { weapon: this.equipped });
    return dropped;
  }
}

class AttackManager {
  constructor({ eventBus, weaponManager, damageManager, raycastManager, player }) {
    this.bus = eventBus;
    this.weapons = weaponManager;
    this.damage = damageManager;
    this.raycast = raycastManager;
    this.player = player;
    this.unarmedDamage = 8;
    this.unarmedRange = 1.6;
    this.unarmedRate = 550;
    this._lastUnarmedAttack = -Infinity;
    this.comboMultiplier = 2; // dash-then-attack damage bonus
    this.multiplayer = null; // set by Game once MultiplayerManager exists
  }

  // Hits against a real remote player, or against a bot once a
  // MultiplayerManager is active, never apply damage locally — the server
  // is authoritative over health/damage in multiplayer. We just report the
  // swing (for the local swing animation / crosshair feedback) and forward
  // the claimed hit to the server, which independently re-checks range,
  // cooldown and weapon damage before broadcasting the real result.
  _reportRemoteHit(weaponId, targetId, info, now) {
    this.bus.emit('attack-swing', { weapon: this.weapons.equipped });
    if (this.multiplayer && this.multiplayer.active) {
      this.multiplayer.sendAttack({ targetId, weaponId, bodyPart: info.bodyPart, clientTime: now });
    }
  }

  // Solo/offline play keeps bots as simple local target dummies (original
  // behavior); once in a multiplayer room, bots are server-authoritative
  // just like other players, so their hits route over the network too.
  _isNetworkedTarget(info) {
    if (info.kind === 'remotePlayer') return true;
    if (info.kind === 'enemy' && this.multiplayer && this.multiplayer.active) return true;
    return false;
  }
  _targetIdOf(info) { return info.kind === 'remotePlayer' ? info.remotePlayer.id : info.enemy.id; }

  _getComboMultiplier() {
    // Only the first attack inside the post-dash window is doubled;
    // consuming it here means a second attack (even before cooldown ends)
    // does normal damage, matching "one bonus hit per dash".
    if (this.player && this.player.isInDashAttackWindow) {
      this.player.consumeDashAttackWindow();
      return this.comboMultiplier;
    }
    return 1;
  }

  requestAttack(now) {
    const weapon = this.weapons.equipped;

    if (!weapon) {
      if (now - this._lastUnarmedAttack < this.unarmedRate) return;
      this._lastUnarmedAttack = now;
      const hit = this.raycast.queryCenter(this.unarmedRange);
      const info = this.raycast.classifyHit(hit);
      if (this._isNetworkedTarget(info)) { this._reportRemoteHit(null, this._targetIdOf(info), info, now); return; }
      let anyHit = null;
      if (info.kind === 'enemy') {
        const bonus = this._getComboMultiplier();
        anyHit = this.damage.applyHit({ damage: this.unarmedDamage, headMultiplier: 2, limbMultiplier: 0.7 }, info, bonus);
      }
      this.bus.emit('attack-swing', { weapon: null });
      if (anyHit) this.bus.emit('hitmarker', anyHit);
      return;
    }

    if (now - weapon.lastAttackTime < weapon.attackRate) return;

    const hit = this.raycast.queryCenter(weapon.range);
    const info = this.raycast.classifyHit(hit);
    if (this._isNetworkedTarget(info)) { weapon.lastAttackTime = now; this._reportRemoteHit(weapon.id, this._targetIdOf(info), info, now); return; }

    weapon.lastAttackTime = now;
    let anyHit = null;
    if (info.kind === 'enemy') {
      const bonus = this._getComboMultiplier();
      anyHit = this.damage.applyHit(weapon, info, bonus);
    }

    this.bus.emit('attack-swing', { weapon });
    if (anyHit) this.bus.emit('hitmarker', anyHit);
  }
}

class PickupManager {
  constructor({ eventBus, world, player, weaponManager }) {
    this.bus = eventBus;
    this.world = world;
    this.player = player;
    this.weapons = weaponManager;
    this.nearest = null;
    this.pickupRange = 3.2;
    this.network = null; // set by Game once MultiplayerManager exists
  }
  update() {
    let closest = null;
    let closestDist = this.pickupRange;
    for (const pickup of this.world.pickups) {
      if (pickup.collected) continue;
      const dist = this.player.position.distanceTo(pickup.mesh.position);
      if (dist < closestDist) { closestDist = dist; closest = pickup; }
    }
    this.nearest = closest;
    this.bus.emit('pickup-nearby', { pickup: closest });
    return closest;
  }
  collect() {
    const pickup = this.nearest;
    if (!pickup || pickup.collected) return;

    // In multiplayer, the pickup isn't granted until the server confirms it
    // (it arbitrates simultaneous grabs). MultiplayerManager calls
    // finalizeCollect() itself once it receives that confirmation.
    if (this.network && this.network.active) {
      pickup.collected = true; // optimistic lock so we don't spam requests
      this.network.requestPickup(pickup.id);
      return;
    }

    this.finalizeCollect(pickup);
  }

  finalizeCollect(pickup) {
    if (!pickup) return;
    pickup.collected = true;

    if (pickup.type === 'weapon') this.weapons.addWeapon(pickup.weaponId);
    else if (pickup.type === 'health') this.bus.emit('health-pickup', { amount: pickup.amount });
    else this.bus.emit('generic-pickup', { pickup });

    this.bus.emit('pickup-collected', { pickup });

    const mesh = pickup.mesh;
    const duration = 220;
    const start = performance.now();
    const startScale = mesh.scale.x;
    const anim = () => {
      const t = Math.min(1, (performance.now() - start) / duration);
      const s = startScale * (1 - t);
      mesh.scale.set(s, s, s);
      if (t < 1) requestAnimationFrame(anim);
      else this.world.removePickup(pickup);
    };
    requestAnimationFrame(anim);
  }
}

class DropManager {
  constructor({ eventBus, world, player, cameraRig, weaponManager }) {
    this.bus = eventBus;
    this.world = world;
    this.player = player;
    this.cameraRig = cameraRig;
    this.weapons = weaponManager;
    this.network = null; // set by Game once MultiplayerManager exists
  }
  _dropPosition() {
    const yaw = this.cameraRig.getYaw();
    const forward = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw));
    return this.player.position.clone().addScaledVector(forward, 1.4).setY(0.4);
  }
  dropEquippedWeapon() {
    const dropped = this.weapons.dropEquipped();
    if (!dropped) return;
    const pos = this._dropPosition();
    // Locally we always spawn it immediately (no need to wait on a round
    // trip for our own drop). We tell the server so it can broadcast the
    // new pickup to everyone else in the room with a canonical id.
    const localId = this.network && this.network.active ? this.network.makeLocalPickupId() : undefined;
    const pickup = this.world.addDroppedItem({ id: localId, type: 'weapon', weaponId: dropped.id, label: dropped.name, position: [pos.x, pos.y, pos.z] });
    if (this.network && this.network.active) {
      this.network.requestDrop({ id: pickup.id, weaponId: dropped.id, label: dropped.name, position: [pos.x, pos.y, pos.z] });
    }
    this.bus.emit('weapon-dropped', { weapon: dropped, pickup });
  }
}

const WEAPON_ICONS = { sword: '🗡️', axe: '🪓', spear: '🔱', dagger: '🔪', hammer: '🔨' };

class UIManager {
  constructor(eventBus, weaponManager, dropManager) {
    this.bus = eventBus;
    this.weapons = weaponManager;
    this.dropManager = dropManager;
    this.weaponHud = document.getElementById('weapon-hud');
    this.interactPrompt = document.getElementById('interact-prompt');
    this.hitMarker = document.getElementById('hit-marker');
    this.damagePopupLayer = document.getElementById('damage-popup-layer');
    this.damageFlash = document.getElementById('damage-flash');
    this.pickupToast = document.getElementById('pickup-toast');
    this.inventoryPanel = document.getElementById('inventory-panel');
    this.inventoryGrid = document.getElementById('inventory-grid');
    this.dropZone = document.getElementById('inventory-drop-zone');
    this._toastTimer = null;
    this.inventoryOpen = false;
    this._dragIndex = null;
    this._dragEl = null;

    this.bus.on('weapon-equipped', ({ weapon }) => { this._renderWeapon(weapon); this._renderInventoryGrid(); });
    this.bus.on('pickup-nearby', ({ pickup }) => this._renderPrompt(pickup));
    this.bus.on('hitmarker', (hit) => this._showHitMarker(hit));
    this.bus.on('hit', (hit) => this._showDamagePopup(hit));
    this.bus.on('player-damaged', () => this._flashDamage());
    this.bus.on('pickup-collected', ({ pickup }) => { this._showToast('Picked up ' + pickup.label); this._renderInventoryGrid(); });
    this.bus.on('inventory-changed', () => this._renderInventoryGrid());

    document.getElementById('inventory-close').addEventListener('click', () => this.closeInventory());
    this.inventoryPanel.addEventListener('click', (e) => { if (e.target === this.inventoryPanel) this.closeInventory(); });

    this.dropZone.addEventListener('dragover', (e) => { e.preventDefault(); this.dropZone.classList.add('drag-over'); });
    this.dropZone.addEventListener('dragleave', () => this.dropZone.classList.remove('drag-over'));
    this.dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      this.dropZone.classList.remove('drag-over');
      if (this._dragIndex !== null) { this._dropWeaponAt(this._dragIndex); this._dragIndex = null; }
    });

    this._renderWeapon(null);
  }

  toggleInventory() { this.inventoryOpen ? this.closeInventory() : this.openInventory(); }
  openInventory() { this.inventoryOpen = true; this._renderInventoryGrid(); this.inventoryPanel.classList.add('visible'); }
  closeInventory() { this.inventoryOpen = false; this.inventoryPanel.classList.remove('visible'); }

  _renderInventoryGrid() {
    this.inventoryGrid.innerHTML = '';
    this.dropZone.classList.remove('drag-over');

    if (this.weapons.inventory.length === 0) {
      const msg = document.createElement('div');
      msg.id = 'inventory-empty-msg';
      msg.textContent = 'No weapons carried yet. Walk up to a weapon and pickup.';
      this.inventoryGrid.appendChild(msg);
      return;
    }

    this.weapons.inventory.forEach((weapon, index) => {
      const slot = document.createElement('div');
      slot.className = 'inv-slot' + (index === this.weapons.equippedIndex ? ' equipped' : '');
      slot.draggable = true;
      slot.innerHTML = `
        <div class="slot-icon">${WEAPON_ICONS[weapon.id] || '⚔️'}</div>
        <div class="slot-label">${weapon.name}</div>
        <div class="slot-stat">${weapon.damage}</div>
      `;

      // Tap/click a slot to equip it.
      slot.addEventListener('click', () => { this.weapons.equip(index); this.closeInventory(); });

      // --- Desktop drag-and-drop (HTML5 DnD) ---
      slot.addEventListener('dragstart', (e) => {
        this._dragIndex = index;
        e.dataTransfer.effectAllowed = 'move';
      });

      // --- Mobile drag (pointer-based, since HTML5 DnD doesn't fire on touch) ---
      slot.addEventListener('pointerdown', (e) => {
        this._dragIndex = index;
        this._dragEl = slot;
        slot.setPointerCapture(e.pointerId);
      });
      slot.addEventListener('pointermove', (e) => {
        if (this._dragIndex !== index) return;
        const overDropZone = this._isPointOverElement(e.clientX, e.clientY, this.dropZone);
        this.dropZone.classList.toggle('drag-over', overDropZone);
      });
      slot.addEventListener('pointerup', (e) => {
        if (this._dragIndex !== index) return;
        const overDropZone = this._isPointOverElement(e.clientX, e.clientY, this.dropZone);
        this.dropZone.classList.remove('drag-over');
        if (overDropZone) this._dropWeaponAt(index);
        this._dragIndex = null;
        this._dragEl = null;
      });

      this.inventoryGrid.appendChild(slot);
    });
  }

  _isPointOverElement(x, y, el) {
    const rect = el.getBoundingClientRect();
    return x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom;
  }

  _dropWeaponAt(index) {
    // Equip the dragged weapon first if it isn't already, then drop it.
    if (index !== this.weapons.equippedIndex) this.weapons.equip(index);
    this.dropManager.dropEquippedWeapon();
    this._renderInventoryGrid();
  }

  _renderWeapon(weapon) {
    this.weaponHud.textContent = weapon ? weapon.name.toUpperCase() : 'UNARMED';
  }

  _renderPrompt(pickup) {
    if (!pickup) {
      this.interactPrompt.classList.remove('visible');
      return;
    }
    this.interactPrompt.textContent = `Double-tap to pick up — ${pickup.label}`;
    this.interactPrompt.classList.add('visible');
  }

  _showHitMarker(hit) {
    this.hitMarker.classList.remove('show', 'combo');
    void this.hitMarker.offsetWidth;
    this.hitMarker.classList.add('show');
    if (hit && hit.comboBonus) this.hitMarker.classList.add('combo');
  }

  _showDamagePopup(hit) {
    if (!hit || typeof hit.damage !== 'number') return;
    const el = document.createElement('div');
    el.className = 'damage-popup';
    if (hit.headshot) el.classList.add('headshot');
    if (hit.comboBonus) el.classList.add('combo');
    el.textContent = (hit.headshot ? hit.damage + ' HS' : String(hit.damage)) + (hit.comboBonus ? '!' : '');
    el.style.setProperty('--drift-x', (Math.random() * 40 - 20) + 'px');
    this.damagePopupLayer.appendChild(el);
    setTimeout(() => el.remove(), 950);
  }

  _flashDamage() {
    this.damageFlash.classList.add('show');
    setTimeout(() => this.damageFlash.classList.remove('show'), 260);
  }

  _showToast(text) {
    this.pickupToast.textContent = text;
    this.pickupToast.classList.add('show');
    clearTimeout(this._toastTimer);
    this._toastTimer = setTimeout(() => this.pickupToast.classList.remove('show'), 1400);
  }
}

/* =====================================================================
 * MULTIPLAYER
 * =====================================================================
 * Wire protocol (JSON text frames over one WebSocket per player):
 *
 * Client -> Server
 *   {t:'hello', name, room}                 room omitted/empty -> server creates one
 *   {t:'state', x,y,z,yaw,seq,moving,running,crouching,dashing,jumping,weaponId}
 *   {t:'attack', targetId, weaponId, bodyPart, clientTime}
 *   {t:'pickup', pickupId}
 *   {t:'drop', id, weaponId, label, position}
 *   {t:'ping', time}
 *
 * Server -> Client
 *   {t:'welcome', id, room, players:[...], collected:[pickupId,...]}
 *   {t:'player-joined', player}
 *   {t:'player-left', id}
 *   {t:'state-batch', players:[{id,x,y,z,yaw,moving,running,crouching,dashing,jumping,weaponId}]}
 *   {t:'attack-result', attackerId, targetId, damage, targetHealth, headshot}
 *   {t:'death', id, killerId, respawnDelay}
 *   {t:'respawn', id, x,y,z}
 *   {t:'pickup-collected', pickupId, by}
 *   {t:'pickup-denied', pickupId}
 *   {t:'weapon-dropped', pickup:{id,weaponId,label,position}}
 *   {t:'room-error', message}
 *   {t:'pong', time}
 *
 * Position/rotation updates are sent at a fixed low rate (default 15Hz,
 * see NetworkManager.SEND_HZ) completely independent of render FPS.
 * The server never trusts client-reported damage — see server/server.js.
 * ===================================================================== */

class NetworkManager {
  static SEND_HZ = 15;
  static MAX_PRECONNECT_RETRIES = 4; // give up (not loop forever) if we never even reach a first 'welcome'

  constructor() {
    this.ws = null;
    this.url = null;
    this.name = 'Player';
    this.room = '';
    this._listeners = new Map();
    this.connected = false;
    this._shouldReconnect = false;
    this._reconnectAttempts = 0;
    this._reconnectTimer = null;
    this._pingInterval = null;
    this._receivedWelcome = false; // true once we've joined a room at least once this session
  }

  on(type, fn) {
    if (!this._listeners.has(type)) this._listeners.set(type, []);
    this._listeners.get(type).push(fn);
  }

  _emit(type, payload) {
    const arr = this._listeners.get(type);
    if (!arr) return;
    for (const fn of arr.slice()) fn(payload);
  }

  // Always tears down any existing socket/timers first — guarantees only
  // one live WebSocket per NetworkManager even if connect() is called
  // again while a previous attempt/reconnect-loop is still in flight
  // (double-clicking Create/Join, retrying after a typo'd address, etc.)
  connect(url, name, room) {
    this._teardown();
    this.url = url;
    this.name = name;
    this.room = room || '';
    this._shouldReconnect = true;
    this._reconnectAttempts = 0;
    this._receivedWelcome = false;
    this._open();
  }

  _teardown() {
    this._shouldReconnect = false; // so the old socket's 'close' handler won't schedule its own reconnect
    clearTimeout(this._reconnectTimer);
    clearInterval(this._pingInterval);
    if (this.ws) {
      // Listeners were added with addEventListener, so there's no single
      // handler property to null out here — instead every listener below
      // checks `this.ws !== socket` and no-ops once superseded, which is
      // what actually makes an old, closing socket inert.
      try { this.ws.close(); } catch { /* already closed */ }
    }
    this.ws = null;
    this.connected = false;
  }

  _open() {
    let socket;
    try {
      socket = new WebSocket(this.url);
    } catch (err) {
      this._emit('fatal', { message: 'Invalid server address.' });
      return;
    }
    this.ws = socket;
    socket.addEventListener('open', () => {
      if (this.ws !== socket) return; // superseded by a newer connect()/teardown
      this.connected = true;
      this._reconnectAttempts = 0;
      this._send({ t: 'hello', name: this.name, room: this.room });
      clearInterval(this._pingInterval);
      this._pingInterval = setInterval(() => this._send({ t: 'ping', time: Date.now() }), 5000);
      this._emit('open', {});
    });
    socket.addEventListener('message', (ev) => {
      if (this.ws !== socket) return;
      let msg;
      try { msg = JSON.parse(ev.data); } catch { return; }
      if (msg.t === 'welcome') {
        this.room = msg.room; // remember it so a dropped connection re-joins the same room
        this._receivedWelcome = true;
      }
      this._emit(msg.t, msg);
    });
    socket.addEventListener('close', () => {
      if (this.ws !== socket) return; // an old socket closing after we've already moved on — ignore
      this.connected = false;
      clearInterval(this._pingInterval);
      this._emit('close', {});
      if (this._shouldReconnect) this._scheduleReconnect();
    });
    socket.addEventListener('error', () => { /* 'close' also fires; handled there */ });
  }

  _scheduleReconnect() {
    if (!this._receivedWelcome && this._reconnectAttempts >= NetworkManager.MAX_PRECONNECT_RETRIES) {
      this._shouldReconnect = false;
      this._emit('fatal', { message: 'Could not reach the server. Check the address and that it is running, then try again.' });
      return;
    }
    clearTimeout(this._reconnectTimer);
    const delay = Math.min(1000 * Math.pow(1.6, this._reconnectAttempts), 8000);
    this._reconnectAttempts++;
    this._emit('reconnecting', { attempt: this._reconnectAttempts, delayMs: delay });
    this._reconnectTimer = setTimeout(() => { if (this._shouldReconnect) this._open(); }, delay);
  }

  _send(obj) {
    if (this.ws && this.ws.readyState === WebSocket.OPEN) this.ws.send(JSON.stringify(obj));
  }

  sendState(state) { this._send({ t: 'state', ...state }); }
  sendAttack(payload) { this._send({ t: 'attack', ...payload }); }
  sendPickup(pickupId) { this._send({ t: 'pickup', pickupId }); }
  sendDrop(payload) { this._send({ t: 'drop', ...payload }); }

  disconnect() { this._teardown(); }
}

// A lightweight stand-in for another player's Player instance: visual mesh
// (reusing the same capsule+head look, tinted per-player) plus a target
// transform that we interpolate toward every frame, since network updates
// only arrive ~15 times/sec but we render at up to 60+.
const REMOTE_COLORS = [0xff6b6b, 0x66d1ff, 0xffd166, 0x8aff8a, 0xd18aff, 0xff9f4a, 0x4ad1c0, 0xffffff];

// Shared across every RemotePlayer/bot instance (up to 8 remote players +
// 3 bots) instead of allocating a fresh geometry/material per instance —
// same visuals, far fewer GPU buffers/shader programs to manage on mobile.
const _remoteTorsoGeometry = new THREE.CapsuleGeometry(0.28, 0.75, 4, 8);
const _remoteHeadGeometry = new THREE.SphereGeometry(0.22, 16, 16);
const _remoteMaterialCache = new Map(); // color -> MeshStandardMaterial
function _remoteMaterial(color) {
  if (!_remoteMaterialCache.has(color)) {
    _remoteMaterialCache.set(color, new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.15 }));
  }
  return _remoteMaterialCache.get(color);
}

class RemotePlayer {
  constructor(scene, { id, name, x, y, z, yaw, health, maxHealth }, colorIndex) {
    this.id = id;
    this.name = name || 'Player';
    this.health = health ?? 100;
    this.maxHealth = maxHealth ?? 100;
    this.alive = true;
    this.weaponId = null;

    this.position = new THREE.Vector3(x || 0, y || 0, z || 0);
    this.yaw = yaw || 0;
    this._targetPos = this.position.clone();
    this._targetYaw = this.yaw;
    this._lastUpdateTime = performance.now();

    const color = REMOTE_COLORS[colorIndex % REMOTE_COLORS.length];
    const mat = _remoteMaterial(color);
    this.mesh = new THREE.Group();
    const torso = new THREE.Mesh(_remoteTorsoGeometry, mat);
    torso.position.y = 1.05;
    // Remote players/bots skip shadow casting — with up to 7 remote
    // players + 3 bots on screen, dynamic shadow casters are one of the
    // most expensive things a mobile GPU can be asked to do per frame.
    // The local player still casts a shadow, so this is barely noticeable.
    torso.castShadow = false;
    torso.receiveShadow = false;
    const head = new THREE.Mesh(_remoteHeadGeometry, mat);
    head.position.y = 1.62;
    head.castShadow = false;
    head.receiveShadow = false;
    this.mesh.add(torso, head);
    this.mesh.position.copy(this.position);
    scene.add(this.mesh);

    // Movement-state visuals synced alongside position (crouch/dash/jump).
    // Actual vertical position already reflects jumping via `y`; these add
    // a squash/stretch cue so the states read clearly at a glance too.
    this.crouching = false;
    this.dashing = false;
    this.grounded = true;
    this._scale = new THREE.Vector3(1, 1, 1);
    this._targetScale = new THREE.Vector3(1, 1, 1);

    torso.userData.entityType = 'remotePlayer';
    torso.userData.remotePlayerRef = this;
    torso.userData.bodyPart = 'body';
    head.userData.entityType = 'remotePlayer';
    head.userData.remotePlayerRef = this;
    head.userData.bodyPart = 'head';
    this.headMesh = head;
    this.bodyMesh = torso;
  }

  applyServerState(state) {
    this._targetPos.set(state.x, state.y, state.z);
    this._targetYaw = state.yaw;
    if (typeof state.weaponId !== 'undefined') this.weaponId = state.weaponId;
    if (typeof state.crouching === 'boolean') this.crouching = state.crouching;
    if (typeof state.dashing === 'boolean') this.dashing = state.dashing;
    if (typeof state.grounded === 'boolean') this.grounded = state.grounded;
    this._lastUpdateTime = performance.now();
  }

  setHealth(health, maxHealth) {
    this.health = health;
    if (typeof maxHealth === 'number') this.maxHealth = maxHealth;
  }

  playDeath() {
    this.alive = false;
    this.mesh.rotation.z = Math.PI / 2.2;
    this.mesh.position.y = 0.2;
    this.mesh.scale.set(1, 1, 1);
  }

  playRespawn(x, y, z) {
    this.alive = true;
    this.health = this.maxHealth;
    this.mesh.rotation.z = 0;
    this.mesh.scale.set(1, 1, 1);
    this.position.set(x, y, z);
    this._targetPos.set(x, y, z);
    this.mesh.position.copy(this.position);
  }

  // Interpolate toward the last known server state. A short extrapolation
  // window (~150ms) smooths over the gap between the ~15Hz network updates
  // without visibly lagging behind on a healthy connection.
  tick(delta) {
    if (!this.alive) return;
    const lerpRate = 12;
    this.position.x = THREE.MathUtils.damp(this.position.x, this._targetPos.x, lerpRate, delta);
    this.position.y = THREE.MathUtils.damp(this.position.y, this._targetPos.y, lerpRate, delta);
    this.position.z = THREE.MathUtils.damp(this.position.z, this._targetPos.z, lerpRate, delta);
    let diff = this._targetYaw - this.yaw;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    this.yaw += diff * (1 - Math.exp(-lerpRate * delta));
    this.mesh.position.copy(this.position);
    this.mesh.rotation.y = this.yaw;

    // Squash for crouch, stretch for dash, small hop pop when airborne —
    // purely cosmetic, driven by the movement flags in the last state update.
    if (this.crouching) this._targetScale.set(1.1, 0.62, 1.1);
    else if (this.dashing) this._targetScale.set(0.9, 0.95, 1.25);
    else if (!this.grounded) this._targetScale.set(0.95, 1.08, 0.95);
    else this._targetScale.set(1, 1, 1);
    this._scale.x = THREE.MathUtils.damp(this._scale.x, this._targetScale.x, 10, delta);
    this._scale.y = THREE.MathUtils.damp(this._scale.y, this._targetScale.y, 10, delta);
    this._scale.z = THREE.MathUtils.damp(this._scale.z, this._targetScale.z, 10, delta);
    this.mesh.scale.copy(this._scale);
  }

  dispose(scene) {
    scene.remove(this.mesh);
  }
}

class MultiplayerManager {
  constructor(game) {
    this.game = game;
    this.net = new NetworkManager();
    this.active = false; // true once we've successfully joined a room
    this.localId = null;
    this.remotePlayers = new Map(); // id -> RemotePlayer
    this._sendAccum = 0;
    this._colorCounter = 0;
    this._pendingRespawn = null;

    this._bindLobbyUI();
    this._bindNetworkEvents();

    // Best-effort clean disconnect so other clients don't have to wait on
    // the server's stale-connection timeout to remove us (avoids "ghost
    // players" lingering in the map after a tab close / app background).
    window.addEventListener('pagehide', () => this.net.disconnect());
    window.addEventListener('beforeunload', () => this.net.disconnect());
  }

  // ---------- Lobby ----------
  _bindLobbyUI() {
    this.lobbyEl = document.getElementById('mp-lobby');
    this.errorEl = document.getElementById('mp-error');
    this.roomInfoEl = document.getElementById('mp-room-info');
    this.roomCodeEl = document.getElementById('mp-room-code-display');
    this.playerListEl = document.getElementById('mp-player-list');
    this.serverInput = document.getElementById('mp-server-input');
    this.nameInput = document.getElementById('mp-name-input');
    this.roomInput = document.getElementById('mp-room-input');

    try {
      const saved = JSON.parse(localStorage.getItem('mp-lobby-prefs') || '{}');
      if (saved.server) this.serverInput.value = saved.server;
      if (saved.name) this.nameInput.value = saved.name;
    } catch { /* ignore */ }

    document.getElementById('mp-create-btn').addEventListener('click', () => this._attemptConnect(''));
    document.getElementById('mp-join-btn').addEventListener('click', () => this._attemptConnect((this.roomInput.value || '').trim().toUpperCase()));
    document.getElementById('mp-solo-btn').addEventListener('click', () => { this.lobbyEl.classList.add('hidden'); });

    this._bindLoginUI();
  }

  // ---------- Firebase-backed login/profile/friends (account data only) ----------
  _bindLoginUI() {
    const loginErrorEl = document.getElementById('mp-login-error');
    document.getElementById('mp-google-btn').addEventListener('click', async () => {
      loginErrorEl.textContent = '';
      try { await firebaseManager.signInGoogle(); }
      catch (err) { loginErrorEl.textContent = err?.message || 'Google sign-in failed. Please try again.'; }
    });
    document.getElementById('mp-guest-btn').addEventListener('click', async () => {
      loginErrorEl.textContent = '';
      const name = document.getElementById('mp-guest-name-input').value.trim();
      try { await firebaseManager.signInGuest(name); }
      catch (err) { loginErrorEl.textContent = err?.message || 'Could not continue as guest. Please try again.'; }
    });
    document.getElementById('mp-add-friend-btn').addEventListener('click', async () => {
      const errEl = document.getElementById('mp-friend-error');
      const input = document.getElementById('mp-friend-uid-input');
      errEl.textContent = '';
      try { await firebaseManager.addFriendByGameId(input.value); input.value = ''; this._renderFriendsList(); }
      catch (err) { errEl.textContent = err?.message || 'Could not add that friend.'; }
    });

    firebaseManager.on('signedIn', (profile) => this._onFirebaseSignedIn(profile));
    firebaseManager.on('error', ({ message }) => { loginErrorEl.textContent = message; });

    // If a session was already persisted (e.g. a page refresh after Google
    // sign-in), FirebaseManager's onAuthStateChanged will fire 'signedIn'
    // shortly after load without any click needed — the login view stays
    // visible only until then.
  }

  _onFirebaseSignedIn(profile) {
    document.getElementById('mp-login-view').style.display = 'none';
    document.getElementById('mp-room-view').style.display = 'block';
    if (!this.nameInput.value) this.nameInput.value = profile.displayName || 'Player';

    const summary = document.getElementById('mp-profile-summary');
    summary.style.display = 'block';
    const xp = profile.stats?.xp ?? 0;
    summary.textContent = `Signed in as ${profile.displayName} — Kills: ${profile.stats?.kills ?? 0}  Deaths: ${profile.stats?.deaths ?? 0}  XP: ${xp}`;

    if (firebaseManager.user && !firebaseManager.user.isGuest) {
      document.getElementById('mp-friends-panel').style.display = 'block';
      document.getElementById('mp-my-uid').textContent = profile.gameId || '(allocating...)';
      this._renderFriendsList();
    }

    // Restore any weapons the account had saved from a previous session.
    for (const weaponId of (profile.inventory || [])) this.game.weaponManager.addWeapon(weaponId);
  }

  _renderFriendsList() {
    const list = document.getElementById('mp-friends-list');
    list.innerHTML = '';
    for (const f of (firebaseManager.profile?.friends || [])) {
      const li = document.createElement('li');
      li.textContent = f.name;
      list.appendChild(li);
    }
  }

  _attemptConnect(roomCode) {
    const server = this.serverInput.value.trim();
    const name = (this.nameInput.value.trim() || 'Player').slice(0, 16);
    this.errorEl.textContent = '';
    if (!server) { this.errorEl.textContent = 'Enter a server address (e.g. wss://your-server.example.com).'; return; }
    try { localStorage.setItem('mp-lobby-prefs', JSON.stringify({ server, name })); } catch { /* ignore */ }
    this._setStatus('connecting', 'Connecting...');
    // Prevent double-clicks (or clicking Create then Join before the first
    // attempt resolves) from firing connect() twice — NetworkManager.connect()
    // is self-cleaning either way, but this also gives clearer button feedback.
    this._setConnectButtonsEnabled(false);
    this.net.connect(server, name, roomCode);
  }

  _setConnectButtonsEnabled(enabled) {
    document.getElementById('mp-create-btn').disabled = !enabled;
    document.getElementById('mp-join-btn').disabled = !enabled;
  }

  _setStatus(cls, text) {
    const el = document.getElementById('mp-status');
    el.className = cls;
    document.getElementById('mp-status-text').textContent = text;
  }

  // ---------- Network wiring ----------
  _bindNetworkEvents() {
    const n = this.net;
    n.on('open', () => {});
    n.on('close', () => { if (this.active) this._setStatus('disconnected', 'Disconnected — reconnecting...'); });
    n.on('reconnecting', ({ attempt }) => this._setStatus('disconnected', `Reconnecting (attempt ${attempt})...`));
    n.on('fatal', ({ message }) => {
      this.errorEl.textContent = message;
      this._setStatus('disconnected', 'Offline');
      this._setConnectButtonsEnabled(true);
    });
    n.on('room-error', ({ message }) => {
      this.errorEl.textContent = message;
      this._setStatus('disconnected', 'Offline');
      this._setConnectButtonsEnabled(true);
      this.net.disconnect();
    });

    n.on('welcome', (msg) => this._onWelcome(msg));
    n.on('player-joined', (msg) => this._onPlayerJoined(msg.player));
    n.on('player-left', (msg) => this._onPlayerLeft(msg.id));
    n.on('state-batch', (msg) => this._onStateBatch(msg.players, msg.bots));
    n.on('attack-result', (msg) => this._onAttackResult(msg));
    n.on('death', (msg) => this._onDeath(msg));
    n.on('respawn', (msg) => this._onRespawn(msg));
    n.on('bot-death', (msg) => this._onBotDeath(msg));
    n.on('bot-respawn', (msg) => this._onBotRespawn(msg));
    n.on('pickup-collected', (msg) => this._onPickupCollected(msg));
    n.on('pickup-denied', (msg) => this._onPickupDenied(msg));
    n.on('weapon-dropped', (msg) => this._onWeaponDropped(msg));
  }

  _onWelcome(msg) {
    this.active = true;
    this.localId = msg.id;
    this.game.player.id = msg.id;
    this._setStatus('connected', `Room ${msg.room} — ${msg.players.length + 1}/8`);
    this.lobbyEl.classList.add('hidden');
    this.roomInfoEl.style.display = 'block';
    this.roomCodeEl.textContent = msg.room;
    document.getElementById('local-health-wrap').classList.add('active');

    // Defensive reconciliation: drop any remote player we're tracking that
    // the server's fresh player list doesn't include (guards against a
    // "ghost player" surviving a reconnect if an earlier player-left was
    // somehow missed).
    const incomingIds = new Set(msg.players.map((p) => p.id));
    for (const id of [...this.remotePlayers.keys()]) {
      if (!incomingIds.has(id)) this._onPlayerLeft(id);
    }

    for (const p of msg.players) this._onPlayerJoined(p, /*silent*/ true);
    this._seedBotState(msg.bots || []);
    for (const pickupId of (msg.collected || [])) {
      const pickup = this.game.world.getPickupById(pickupId);
      if (pickup) { pickup.collected = true; this.game.world.removePickup(pickup); }
    }
    this.game.raycastManager.markDirty();
    this._renderPlayerList();
    firebaseManager.publishRoomPresence(msg.room);
  }
  // no interpolation here, so a bot that's already mid-patrol doesn't
  // visibly slide in from its spawn point.
  _seedBotState(bots) {
    for (const b of bots) {
      const enemy = this.game.world.getEnemyById(b.id);
      if (!enemy) continue;
      enemy.targetPos.set(b.x, b.y, b.z);
      enemy.targetYaw = b.yaw;
      enemy.yaw = b.yaw;
      enemy.mesh.position.set(b.x, b.y, b.z);
      enemy.mesh.rotation.y = b.yaw;
      enemy.health = b.health;
      enemy.maxHealth = b.maxHealth;
      if (!b.alive && enemy.alive) {
        enemy.alive = false;
        enemy.mesh.rotation.z = Math.PI / 2.2;
        enemy.mesh.position.y = 0.2;
      }
    }
  }

  _applyBotState(bots) {
    for (const b of bots) {
      const enemy = this.game.world.getEnemyById(b.id);
      if (!enemy || !enemy.alive) continue;
      enemy.targetPos.set(b.x, b.y, b.z);
      enemy.targetYaw = b.yaw;
      enemy.health = b.health;
      enemy.maxHealth = b.maxHealth;
    }
  }

  _flashEnemyHit(enemy) {
    const mat = enemy.bodyMesh.material;
    const originalEmissive = mat.emissive.getHex();
    mat.emissive.setHex(0xff2222);
    mat.emissiveIntensity = 0.9;
    setTimeout(() => { mat.emissive.setHex(originalEmissive); mat.emissiveIntensity = 0; }, 90);
  }

  _onBotDeath({ id }) {
    const enemy = this.game.world.getEnemyById(id);
    if (!enemy) return;
    enemy.alive = false;
    enemy.mesh.rotation.z = Math.PI / 2.2;
    enemy.mesh.position.y = 0.2;
  }

  _onBotRespawn({ id, x, y, z }) {
    const enemy = this.game.world.getEnemyById(id);
    if (!enemy) return;
    enemy.alive = true;
    enemy.health = enemy.maxHealth;
    enemy.mesh.rotation.z = 0;
    enemy.mesh.position.set(x, y, z);
    enemy.targetPos.set(x, y, z);
    enemy.yaw = 0;
    enemy.targetYaw = 0;
  }

  _onPlayerJoined(p, silent) {
    if (this.remotePlayers.has(p.id)) return;
    const rp = new RemotePlayer(this.game.gameRenderer.scene, p, this._colorCounter++);
    this.remotePlayers.set(p.id, rp);
    this.game.world.remotePlayers.push(rp);
    this.game.raycastManager.markDirty();
    this._renderPlayerList();
    if (!silent) this._showToast(`${p.name} joined the room`);
  }

  _showToast(text) {
    const el = document.getElementById('pickup-toast');
    el.textContent = text;
    el.classList.add('show');
    clearTimeout(this._toastTimer);
    this._toastTimer = setTimeout(() => el.classList.remove('show'), 1400);
  }

  _onPlayerLeft(id) {
    const rp = this.remotePlayers.get(id);
    if (!rp) return;
    rp.dispose(this.game.gameRenderer.scene);
    this.remotePlayers.delete(id);
    this.game.world.remotePlayers = this.game.world.remotePlayers.filter((x) => x !== rp);
    this.game.raycastManager.markDirty();
    this._removeLabel(id);
    this._renderPlayerList();
  }

  _onStateBatch(players, bots) {
    for (const s of players) {
      const rp = this.remotePlayers.get(s.id);
      if (rp) rp.applyServerState(s);
    }
    this._applyBotState(bots || []);
  }

  _onAttackResult({ attackerId, targetId, damage, targetHealth, headshot }) {
    if (attackerId === this.localId) {
      this.game.bus.emit('hitmarker', { comboBonus: false });
      this.game.bus.emit('hit', { damage, headshot });
      if (targetHealth <= 0 && targetId !== this.localId) firebaseManager.recordKill();
    }
    if (targetId === this.localId) {
      this.game.player.health = targetHealth;
      this.game.bus.emit('player-damaged', {});
      return;
    }
    const rp = this.remotePlayers.get(targetId);
    if (rp) { rp.setHealth(targetHealth); return; }
    const enemy = this.game.world.getEnemyById(targetId);
    if (enemy) { enemy.health = targetHealth; this._flashEnemyHit(enemy); }
  }

  _onDeath({ id, respawnDelay }) {
    if (id === this.localId) {
      this.game.player.alive = false;
      firebaseManager.recordDeath();
      const overlay = document.getElementById('death-overlay');
      const subEl = document.getElementById('death-sub-text');
      overlay.classList.add('show');
      let remaining = Math.ceil((respawnDelay || 3000) / 1000);
      subEl.textContent = `Respawning in ${remaining}...`;
      clearInterval(this._pendingRespawn);
      this._pendingRespawn = setInterval(() => {
        remaining -= 1;
        subEl.textContent = remaining > 0 ? `Respawning in ${remaining}...` : 'Respawning...';
      }, 1000);
    } else {
      const rp = this.remotePlayers.get(id);
      if (rp) rp.playDeath();
    }
  }

  _onRespawn({ id, x, y, z }) {
    if (id === this.localId) {
      clearInterval(this._pendingRespawn);
      document.getElementById('death-overlay').classList.remove('show');
      this.game.player.respawn(new THREE.Vector3(x, y, z));
    } else {
      const rp = this.remotePlayers.get(id);
      if (rp) rp.playRespawn(x, y, z);
    }
  }

  _onPickupCollected({ pickupId, by }) {
    const pickup = this.game.world.getPickupById(pickupId);
    if (by === this.localId) {
      // Our own request was granted — actually give the item now.
      if (pickup) this.game.pickupManager.finalizeCollect(pickup);
    } else if (pickup && !pickup.removedByNetwork) {
      pickup.removedByNetwork = true;
      pickup.collected = true;
      this.game.world.removePickup(pickup);
      this.game.raycastManager.markDirty();
    }
  }

  _onPickupDenied({ pickupId }) {
    // Someone else grabbed it first — release our optimistic lock so the
    // (now-removed, since a 'pickup-collected' broadcast follows) pickup
    // doesn't stay permanently un-collectable if that broadcast is somehow missed.
    const pickup = this.game.world.getPickupById(pickupId);
    if (pickup) pickup.collected = false;
  }

  _onWeaponDropped({ pickup }) {
    const existing = this.game.world.getPickupById(pickup.id);
    if (existing) return;
    this.game.world.addDroppedItem({ id: pickup.id, type: 'weapon', weaponId: pickup.weaponId, label: pickup.label, position: pickup.position });
    this.game.raycastManager.markDirty();
  }

  // ---------- Outgoing ----------
  sendAttack(payload) { this.net.sendAttack(payload); }
  requestPickup(pickupId) { this.net.sendPickup(pickupId); }
  requestDrop(payload) { this.net.sendDrop(payload); }
  makeLocalPickupId() { return 'drop_' + this.localId + '_' + Math.random().toString(36).slice(2, 8); }

  _renderPlayerList() {
    this.playerListEl.innerHTML = '';
    const me = document.createElement('li');
    me.textContent = `${this.nameInput.value || 'You'} (you)`;
    this.playerListEl.appendChild(me);
    for (const rp of this.remotePlayers.values()) {
      const li = document.createElement('li');
      li.textContent = rp.name;
      this.playerListEl.appendChild(li);
    }
    document.getElementById('mp-player-count').textContent = `${this.remotePlayers.size + 1}/8 players`;
  }

  _removeLabel(id) {
    const el = document.getElementById('rl-' + id);
    if (el) el.remove();
  }

  // ---------- Per-frame ----------
  tick(delta, camera) {
    for (const rp of this.remotePlayers.values()) rp.tick(delta);
    if (this.active) this._updateLabels(camera);

    if (!this.active) return;

    // Defensive ghost-player sweep: if a remote player hasn't sent any
    // state update in a while, the connection almost certainly dropped and
    // the server's player-left broadcast was lost — remove it locally
    // rather than leaving a frozen "ghost" standing in the world.
    this._ghostCheckAccum = (this._ghostCheckAccum || 0) + delta;
    if (this._ghostCheckAccum > 2) {
      this._ghostCheckAccum = 0;
      const now = performance.now();
      for (const [id, rp] of [...this.remotePlayers.entries()]) {
        if (now - rp._lastUpdateTime > 8000) this._onPlayerLeft(id);
      }
    }

    this._sendAccum += delta;
    const interval = 1 / NetworkManager.SEND_HZ;
    if (this._sendAccum >= interval) {
      this._sendAccum = 0;
      const p = this.game.player;
      this.net.sendState({
        x: p.position.x, y: p.position.y, z: p.position.z, yaw: p.yaw,
        moving: p.currentSpeed > 0.1, dashing: p.isDashing, crouching: p.isCrouching, grounded: p.grounded,
        weaponId: this.game.weaponManager.equipped ? this.game.weaponManager.equipped.id : null,
      });
    }
  }

  _updateLabels(camera) {
    if (!this._labelsContainer) {
      this._labelsContainer = document.getElementById('remote-labels');
      this._labelsW = window.innerWidth;
      this._labelsH = window.innerHeight;
      this._labelScratch = new THREE.Vector3();
      // window.innerWidth/Height are already known without forcing a
      // layout read the way element.clientWidth/Height do — cache them and
      // only refresh on resize instead of every single render frame.
      window.addEventListener('resize', () => {
        this._labelsW = window.innerWidth;
        this._labelsH = window.innerHeight;
      });
    }
    const w = this._labelsW, h = this._labelsH;
    const scratch = this._labelScratch;
    for (const rp of this.remotePlayers.values()) {
      if (!rp._labelEl) {
        const el = document.createElement('div');
        el.id = 'rl-' + rp.id;
        el.className = 'remote-label';
        el.innerHTML = `<div class="rl-name">${rp.name}</div><div class="rl-hb-track"><div class="rl-hb-fill"></div></div>`;
        this._labelsContainer.appendChild(el);
        rp._labelEl = el;
        rp._labelFillEl = el.querySelector('.rl-hb-fill');
      }
      const el = rp._labelEl;
      if (!rp.alive) { el.style.display = 'none'; continue; }
      scratch.set(rp.position.x, rp.position.y + 1.95, rp.position.z).project(camera);
      if (scratch.z > 1 || scratch.z < -1) { el.style.display = 'none'; continue; }
      el.style.display = 'block';
      el.style.left = ((scratch.x * 0.5 + 0.5) * w) + 'px';
      el.style.top = ((-scratch.y * 0.5 + 0.5) * h) + 'px';
      const pct = Math.max(0, Math.min(100, (rp.health / rp.maxHealth) * 100));
      rp._labelFillEl.style.width = pct + '%';
    }
  }
}

class Game {
  constructor() {
    const canvas = document.getElementById('game-canvas');

    this.gameRenderer = new GameRenderer(canvas);
    this.world = new World(this.gameRenderer.scene);
    this.physics = new PhysicsWorld(this.world);
    this.player = new Player(this.gameRenderer.scene, this.physics);
    this.cameraRig = new CameraRig(this.gameRenderer.camera, this.player, this.world);
    this.input = new InputManager(canvas);
    this.controls = new Controls(this.input, this.player, this.cameraRig);

    this.bus = new EventBus();
    this.weaponManager = new WeaponManager(this.bus);
    this.raycastManager = new RaycastManager(this.gameRenderer.camera, this.world);
    this.pointerManager = new PointerManager(this.raycastManager, this.player);
    this.damageManager = new DamageManager(this.bus, this.world);
    this.attackManager = new AttackManager({
      eventBus: this.bus, weaponManager: this.weaponManager,
      damageManager: this.damageManager, raycastManager: this.raycastManager,
      player: this.player,
    });
    this.pickupManager = new PickupManager({
      eventBus: this.bus, world: this.world, player: this.player, weaponManager: this.weaponManager,
    });
    this.dropManager = new DropManager({
      eventBus: this.bus, world: this.world, player: this.player,
      cameraRig: this.cameraRig, weaponManager: this.weaponManager,
    });
    this.uiManager = new UIManager(this.bus, this.weaponManager, this.dropManager);

    // Multiplayer wiring — see the MULTIPLAYER section above. This stays
    // fully inert (no network activity, no behavior change) until the
    // player creates/joins a room from the lobby overlay.
    this.multiplayerManager = new MultiplayerManager(this);
    this.attackManager.multiplayer = this.multiplayerManager;
    this.pickupManager.network = this.multiplayerManager;
    this.dropManager.network = this.multiplayerManager;

    this.bus.on('death', () => this.raycastManager.markDirty());
    this.bus.on('pickup-collected', () => this.raycastManager.markDirty());
    this.bus.on('weapon-dropped', () => this.raycastManager.markDirty());
    // Persist inventory to the signed-in account — debounced inside
    // FirebaseManager, and a no-op entirely for guests/no Firebase project.
    this.bus.on('inventory-changed', ({ inventory }) => firebaseManager.saveInventory(inventory.map((w) => w.id)));

    this.fpsCounter = document.getElementById('fps-counter');
    this._elapsed = 0;
    this._dashBtn = document.getElementById('dash-btn');
    this._dashCooldownFill = document.getElementById('dash-cooldown-fill');

    this.engine = new Engine({
      onUpdate: (delta) => this._update(delta),
      onRender: () => this._render(),
    });

    this._hideLoadingScreen();
    this.engine.start();
  }

  _update(delta) {
    this._elapsed += delta;
    const now = performance.now();

    // While dead in a multiplayer match, freeze movement/combat input until
    // the server sends a respawn — the death overlay is already blocking
    // pointer/touch input, this just stops the underlying sim too.
    const frozen = this.multiplayerManager.active && !this.player.alive;

    if (!frozen) this.controls.update(delta);
    this.cameraRig.update(delta);
    this.world.update(delta, this._elapsed);

    const attackRequested = !frozen && this.input.consumeAttackRequested();
    this.pointerManager.update(delta, attackRequested);

    if (attackRequested) this.attackManager.requestAttack(now);

    if (!frozen) {
      this.pickupManager.update();
      if (this.input.consumePickupRequested()) this.pickupManager.collect();
      if (this.input.consumeDropRequested()) this.dropManager.dropEquippedWeapon();
    }

    if (this.input.consumeInventoryToggle()) this.uiManager.toggleInventory();

    if (this._dashCooldownFill) {
      const cd = this.player.dashCooldownRemaining;
      const pct = CONFIG.player.dashCooldown > 0 ? Math.min(1, cd / CONFIG.player.dashCooldown) : 0;
      this._dashCooldownFill.style.height = (pct * 100) + '%';
      this._dashBtn.classList.toggle('on-cooldown', pct > 0);
    }

    this.multiplayerManager.tick(delta, this.gameRenderer.camera);
    this._updateLocalHealthBar();

    this.fpsCounter.textContent = `FPS: ${this.engine.fps}`;
  }

  _updateLocalHealthBar() {
    if (!this.multiplayerManager.active) return;
    if (!this._healthWrapEl) {
      this._healthWrapEl = document.getElementById('local-health-wrap');
      this._healthFillEl = document.getElementById('local-health-fill');
      this._healthLabelEl = document.getElementById('local-health-label');
    }
    const pct = Math.max(0, Math.min(100, (this.player.health / this.player.maxHealth) * 100));
    this._healthFillEl.style.width = pct + '%';
    this._healthLabelEl.textContent = `${Math.round(this.player.health)} / ${this.player.maxHealth}`;
    this._healthWrapEl.classList.toggle('low', pct <= 30);
  }

  _render() { this.gameRenderer.render(); }

  _hideLoadingScreen() {
    const screen = document.getElementById('loading-screen');
    setTimeout(() => screen.classList.add('hidden'), 300);
  }
}

window.addEventListener('DOMContentLoaded', () => {
  tryLockLandscape();
  document.body.addEventListener('click', tryLockLandscape, { once: true });
  document.body.addEventListener('touchstart', tryLockLandscape, { once: true });
  new Game();
});
  </script>
